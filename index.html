const champ = el => el && (el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && !["checkbox","radio","button","file"].includes(el.type)));
// Le bouton n'apparaît que quand le clavier est vraiment ouvert (l'écran visible rétrécit)
function placeKb(){ const v = window.visualViewport; const bas = v ? v.offsetTop + v.height : window.innerHeight; kb.style.top = (bas - 48) + "px";
  if(v && !champ(document.activeElement)) kbMax = Math.max(kbMax, v.height);
  kb.classList.toggle("on", !!v && champ(document.activeElement) && (v.height < kbMax - 120 || v.height < window.innerHeight - 120)); }
let kbMax = window.visualViewport ? visualViewport.height : 0;
document.addEventListener("focusin", e => { const el = e.target; if(!champ(el)) return;
  if(el.tagName === "INPUT" && !el.getAttribute("enterkeyhint")) el.setAttribute("enterkeyhint", "done");
  placeKb(); setTimeout(placeKb, 350); });
document.addEventListener("focusout", () => setTimeout(() => { if(!champ(document.activeElement)) kb.classList.remove("on"); }, 80));
if(window.visualViewport){ visualViewport.addEventListener("resize", placeKb); visualViewport.addEventListener("scroll", placeKb); }

/* Glisser un module avec le doigt : il se pose où on le lâche (les emplacements peuvent rester libres) */
const tbDrag = {};
// Position visée : sur un emplacement entier, ou collée à un voisin décalé d'un demi-module
function tbAimant(r, m, brut, L){ const w2 = tbW2(m); let p = Math.round(brut / 2) * 2;
  r.mods.forEach(x => { if(x === m) return; for(const c of [x.p + tbW2(x), x.p - w2]) if(c % 2 && Math.abs(brut - c) <= .9) p = c; });
  return Math.max(0, Math.min(L - w2, p)); }
document.addEventListener("pointerdown", e => { const el = e.target.closest && e.target.closest("button.tb-mod"); if(!el || view.name !== "tableau") return;
  Object.assign(tbDrag, {el, x: e.clientX, y: e.clientY, on: false, id: e.pointerId, p: null, g: null}); });

/* ---- Bande de repérage à imprimer (PDF A4 paysage, à l'échelle 1) ---- */
const tbReg = t => Object.assign({pas: 17.5, haut: 16, sym: true}, t.bande || {});
function tbNomFichier(t){ return ("Bande tableau " + (t.chantier || "chantier")).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9 _-]/g, "").replace(/\s+/g, " ").trim().slice(0, 70) + ".pdf"; }

  const lib = await chargerJsPDF(), doc = new lib.jsPDF({unit: "mm", format: "a4", orientation: "landscape"});

  const pol = (s, st, c) => { doc.setFont("helvetica", st || "normal"); doc.setFontSize(s); doc.setTextColor(...(c || [20, 20, 25])); };
  pol(12, "bold"); doc.text(pdfTxt("Bande de repérage — " + t.chantier), M, y + 4);
  pol(8.5, "normal", [110, 110, 120]); doc.text(pdfTxt(`Imprimer à 100 % (taille réelle, sans « ajuster à la page »). 1 module = ${tbNb(pas)} mm (pas standard) · hauteur ${tbNb(haut)} mm. Découper sur le cadre.`), M, y + 9);
  y += 15;
  // Règle de contrôle : doit mesurer 100 mm une fois imprimée
  doc.setDrawColor(120, 120, 130); doc.setLineWidth(.2); doc.line(M, y, M + 100, y); for(let i = 0; i <= 10; i++) doc.line(M + i * 10, y - (i % 5 ? 1 : 2), M + i * 10, y);
  pol(7.5, "normal", [110, 110, 120]); doc.text("Contrôle : ce trait doit mesurer 100 mm", M + 103, y + .8); y += 8;
  tbNorm(t);
  const ics = {}; if(sym) for(const r of t.rangees) for(const m of r.mods){ const k = tbSym(m); if(k && !(k in ics)) ics[k] = await tbIcoImg(k); }
  const maxH = Math.floor(W / pas) * 2, L = t.larg * 2;   // en demi-modules
  t.rangees.forEach((r, ri) => {
    if(!r.mods.length) return;
    // La bande couvre toute la rangée (emplacements libres compris). Trop large pour la feuille : coupée en morceaux, jamais au milieu d'un module
    const coupes = [0]; let a = 0;
    while(L - a > maxH){ let b = a + maxH; const x = r.mods.find(m => m.p < b && m.p + tbW2(m) > b); if(x && x.p > a) b = x.p; coupes.push(b); a = b; }
    coupes.push(L);
    for(let k = 0; k < coupes.length - 1; k++){ const a = coupes[k], b = coupes[k + 1], ms = r.mods.filter(m => m.p >= a && m.p < b); if(!ms.length) continue;
      if(y + haut + 10 > PH - M){ doc.addPage(); y = M; }
      pol(8.5, "bold", [90, 90, 100]); doc.text(pdfTxt(`Rangée ${ri + 1}` + (r.nom ? " — " + r.nom : "") + (coupes.length > 2 ? ` (${k + 1}/${coupes.length - 1})` : "")), M, y + 3); y += 5;

      doc.setDrawColor(205, 205, 212); doc.setLineWidth(.1);

      ms.forEach(m => { const x = X(m.p), w = tbW2(m) * pas / 2, nom = pdfTxt(m.nom || "");
        doc.setDrawColor(120, 120, 130); doc.setLineWidth(.15); doc.line(x, y, x, y + haut); doc.line(x + w, y, x + w, y + haut);
        const pk = sym && ics[tbSym(m)] ? tbSym(m) : "", ap = pk ? Math.min(2.8, haut * .19, w / 2 - .8) : 0, hp = pk ? ap * 2 + 1.4 : 0;   // place du pictogramme en haut
        if(pk) doc.addImage(ics[pk], "PNG", x + w / 2 - ap, y + .9, ap * 2, ap * 2, "ico-" + pk, "FAST");
        if(nom){ const ht = haut - hp - 1.4; let fs = 9, lignes; const coupe = () => nom.split(" ").some(mot => doc.getTextWidth(mot) > w - 1.4);
          for(;;){ pol(fs, "bold"); lignes = doc.splitTextToSize(nom, w - 1.4); if(fs <= 5 || (lignes.length * fs * .3528 * 1.12 <= ht && !coupe())) break; fs -= .5; }

}

const tbPhKey = id => TB_KEY + "-ph-" + id;

function tbToile(src, max){ const k = Math.min(1, max / Math.max(src.width, src.height)), c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(src.width * k)); c.height = Math.max(1, Math.round(src.height * k)); c.getContext("2d").drawImage(src, 0, 0, c.width, c.height); return c; }
function tbImage(file){ return new Promise((ok, ko) => { const u = URL.createObjectURL(file), im = new Image();

function tbScanPrompt(){ return `This photo shows an electrical distribution panel in France (tableau électrique, modular devices clipped on DIN rails).
List every row (rail) from top to bottom and, in each row, every modular device from left to right.

{"larg": 13, "rangees": [{"mods": [{"t": "id40ac", "p": 0, "nom": ""}, {"t": "d16", "p": 2, "nom": "Prises cuisine"}]}], "note": "..."}

- "larg": capacity of one row in modules (1 module = 17.5 mm wide, the width of a single-pole breaker). Choose 13, 18 or 24, the closest to what the enclosure holds.
- "t": one of these type keys (label, width in modules):
${Object.entries(TB_TYPES).filter(([k]) => k !== "vide").map(([k, v]) => `  ${k} = ${v.lib}${v.s ? " " + v.s : ""} (${v.w})`).join("\n")}

- "nom": the circuit label written on, above or under the device (handwritten or printed strip), copied IN FULL exactly as written, every word, never shortened or summarised even if it is long (e.g. "Prises cuisine plan de travail + hotte"). "" if there is no label or it cannot be read.
- A residual-current switch or main switch is usually 2 modules wide with a test button (40 A or 63 A, type AC or A). A breaker is 1 module with its rating printed (C10, C16, C20, C32 or 10 A, 16 A, 20 A, 32 A). If a rating cannot be read, choose the most likely one.

// Résultat de la lecture → rangées et modules, en ne gardant que ce qui est valide
function tbScanApplique(t, res){
  res = res && typeof res === "object" ? res : {}; let maxFin = 0; t.rangees = [];
  (Array.isArray(res.rangees) ? res.rangees : []).slice(0, 10).forEach(rg => { const r = {id: uid(), mods: []}; let fin = 0;
    (Array.isArray(rg && rg.mods) ? rg.mods : []).slice(0, 48).forEach(x => { if(!x || typeof x !== "object") return;
      const k = TB_TYPES[x.t] && x.t !== "vide" ? x.t : "autre", m = {id: uid(), t: k, nom: String(x.nom || "").replace(/\s+/g, " ").trim().slice(0, 200)};
      if(k === "autre"){ m.lib = String(x.lib || "Module").trim().slice(0, 30) || "Module"; m.w = Math.max(.5, Math.min(8, Math.round((+x.w || 1) * 2) / 2)); }
      // z : où se trouve l'appareil sur la photo (zone à montrer, puis place de l'appareil), en fractions de l'image
      if(Array.isArray(x.z) && x.z.length === 6 && x.z.every(v => typeof v === "number" && v >= 0 && v <= 1) && x.z[2] > 0 && x.z[3] > 0) m.z = x.z;
      let p = Math.round(+x.p * 2); if(!(p >= fin)) p = fin; if(fin + tbW2(m) > 48) return; m.p = Math.min(p, 48 - tbW2(m)); fin = m.p + tbW2(m); r.mods.push(m); });
    maxFin = Math.max(maxFin, fin); t.rangees.push(r); });
  const dit = [13, 18, 24].includes(+res.larg) ? +res.larg : 13;
  t.larg = Math.max(dit, [13, 18, 24].find(n => n * 2 >= maxFin) || 24); t.note = String(res.note || "").trim().slice(0, 300); tbNorm(t);
}

    <p class="tb-aide" style="margin-top:14px">🔒 Les codes sont gardés sur ce téléphone uniquement. Ils ne sont envoyés nulle part.</p>
  </main>
  <div class="bottom"><button class="btn" data-o="codeNew">＋ Ajouter une adresse</button></div>`;
}
function cdListeHTML(tri){ return tri.length ? tri.map(c => `<div class="cd" data-cid="${c.id}">
    <div class="cd-h"><div><b>${esc(c.lieu || "Sans nom")}</b>${c.adresse ? `<small>📍 ${esc(c.adresse)}</small>` : ""}</div><button data-o="codeEdit" aria-label="Modifier">✎</button></div>
    ${(c.lignes || []).filter(x => x.val).map((x, k) => `<button class="cd-l" data-o="codeCopie" data-k="${k}"><span>${esc(x.lib || "Code")}</span><b>${esc(x.val)}</b></button>`).join("")}
    ${c.note ? `<p class="cd-n">${esc(c.note)}</p>` : ""}</div>`).join("")
  : codes.length ? `<div class="empty">Aucun résultat</div>`
  : `<div class="vide"><div class="vide-ico">🔑</div><b>Aucun code enregistré</b><p>Ajoute une résidence ou un chantier avec ses digicodes, codes de boîte à clés ou mots de passe. Tu les retrouves ici, même sans réseau.</p></div>`; }
function codeSheet(c){
  const lignes = c ? JSON.parse(JSON.stringify(c.lignes || [])) : []; if(!lignes.length) lignes.push({lib: "Digicode", val: ""});
  const s = sheet(`<h3>${c ? "Modifier l'adresse" : "Nouvelle adresse"}</h3>
    <label class="f"><span>Résidence ou chantier</span><input class="t" id="cdLieu" value="${esc(c ? c.lieu : "")}" placeholder="Ex. Résidence Les Pins" autocomplete="off"></label>
    <label class="f"><span>Adresse</span><input class="t" id="cdAdr" value="${esc(c ? c.adresse || "" : "")}" placeholder="Ex. 12 rue Paradis, Marseille" autocomplete="off"></label>
    <div class="f"><span style="display:block;font-size:12px;color:var(--muted);margin-bottom:4px">Codes et mots de passe</span><div id="cdLs"></div>
      <button class="chip" data-s="plus" style="margin-top:4px">＋ Ajouter un code</button></div>
    <label class="f"><span>Note</span><textarea class="t" id="cdNote" placeholder="Ex. gardien le matin, clé chez la voisine…">${esc(c ? c.note || "" : "")}</textarea></label>
    <div class="row2">${c ? `<button class="btn sec danger-t" data-s="del" style="flex:0 0 auto;width:auto;padding:0 14px">🗑</button>` : `<button class="btn sec" data-s="no">Annuler</button>`}<button class="btn" data-s="ok">Enregistrer</button></div>`);
  const box = s.querySelector("#cdLs");
  const lire = () => [...box.children].map(r => ({lib: r.children[0].value.trim(), val: r.children[1].value.trim()}));
  const dessine = () => { box.innerHTML = lignes.map(x => `<div class="cd-e"><input class="t" value="${esc(x.lib)}" placeholder="Quoi (portail, hall…)" autocomplete="off"><input class="t" value="${esc(x.val)}" placeholder="Code" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button aria-label="Retirer">✕</button></div>`).join("");
    [...box.children].forEach((r, k) => r.children[2].onclick = () => { const v = lire(); v.splice(k, 1); lignes.length = 0; lignes.push(...v); dessine(); }); };
  dessine();
  s.querySelector('[data-s="plus"]').onclick = () => { const v = lire(); lignes.length = 0; lignes.push(...v, {lib: "", val: ""}); dessine(); box.lastChild.children[0].focus(); };
  const no = s.querySelector('[data-s="no"]'); if(no) no.onclick = closeSheet;
  const del = s.querySelector('[data-s="del"]'); if(del) del.onclick = () => confirmSheet(`Supprimer « ${esc(c.lieu)} » et ses codes ?`, "Supprimer", () => { codes = codes.filter(x => x !== c); cdSave(); closeSheet(); render(); });
  s.querySelector('[data-s="ok"]').onclick = () => { const lieu = s.querySelector("#cdLieu").value.trim(); if(!lieu){ toast("Donne un nom à l'adresse"); return; }
    const o = c || {id: uid()}; Object.assign(o, {lieu, adresse: s.querySelector("#cdAdr").value.trim(), note: s.querySelector("#cdNote").value.trim(), lignes: lire().filter(x => x.val), maj: Date.now()});
    if(!c) codes.push(o); cdSave(); closeSheet(); render(); };
}
document.addEventListener("input", e => { if(e.target.id !== "cdQ") return; ui.cdQ = e.target.value; const q = ui.cdQ.toLowerCase();
  const tri = [...codes].sort((a, b) => (a.lieu || "").localeCompare(b.lieu || "", "fr")).filter(c => !q || [c.lieu, c.adresse, c.note, ...(c.lignes || []).map(x => x.lib)].join(" ").toLowerCase().includes(q));
  document.getElementById("cdListe").innerHTML = cdListeHTML(tri); });

/* ---- Documentation technique : PDF gardés dans l'appli (base locale du téléphone) ---- */
const DT = {db: null, liste: null};
function dtOuvrir(){ if(DT.db) return Promise.resolve(DT.db);
  return new Promise((ok, ko) => { let r; try{ r = indexedDB.open("azerem-doc", 1); }catch(e){ return ko(e); }
    r.onupgradeneeded = () => { r.result.createObjectStore("meta", {keyPath: "id"}); r.result.createObjectStore("pdf"); };
    r.onsuccess = () => ok(DT.db = r.result); r.onerror = () => ko(r.error); }); }
function dtReq(mode, f){ return dtOuvrir().then(d => new Promise((ok, ko) => { const tx = d.transaction(["meta", "pdf"], mode); let res; const r = f(tx);
  if(r) r.onsuccess = () => { res = r.result; }; tx.oncomplete = () => ok(res); tx.onerror = tx.onabort = () => ko(tx.error); })); }
// Documents livrés avec l'appli (fichiers du dossier docs/) : toujours là, sur tous les appareils
const DT_FIXES = [
  {id: "fixe-came-bxv-zn7", fixe: true, nom: "CAME BXV (carte ZN7) — portail coulissant, branchements et programmation", dossier: "Portails et automatismes", url: "docs/came-bxv-zn7.pdf", taille: 2347407}
];
const dtCharger = () => dtReq("readonly", tx => tx.objectStore("meta").getAll()).then(a => (DT.liste = [...DT_FIXES, ...(a || [])]), () => (DT.liste = [...DT_FIXES]));
const dtPoids = n => n > 1048576 ? (n / 1048576).toFixed(1).replace(".", ",") + " Mo" : Math.max(1, Math.round(n / 1024)) + " Ko";
const DT_DOSSIERS = ["Schémas", "Notices", "Normes et guides", "Fabricants"];
function renderDoct(){
  $app.innerHTML = `
  <header class="top"><button class="retour" data-act="accueil" aria-label="Retour">‹</button><h1>Documentation technique</h1></header>
  <main><div id="dtListe"><div class="empty">Chargement…</div></div></main>
  <div class="bottom"><button class="btn" data-o="dtNew">＋ Ajouter un PDF</button></div>`;
  dtCharger().then(dtDessine, () => { const b = document.getElementById("dtListe"); if(b) b.innerHTML = `<div class="empty">Ce navigateur ne permet pas de garder des fichiers dans l'appli.</div>`; });
}
function dtDessine(){ const box = document.getElementById("dtListe"); if(!box || view.name !== "doct") return; const L = DT.liste || [];
  if(!L.length){ box.innerHTML = `<div class="vide"><div class="vide-ico">📚</div><b>Aucun document</b><p>Ajoute tes PDF (schémas, notices, guides). Ils sont copiés dans l'appli et restent lisibles sans réseau.</p></div>`; return; }
  const dos = [...new Set(L.map(d => d.dossier || "Divers"))].sort((a, b) => a.localeCompare(b, "fr"));
  box.innerHTML = dos.map(g => { const ds = L.filter(d => (d.dossier || "Divers") === g).sort((a, b) => a.nom.localeCompare(b.nom, "fr"));
    return `<details class="cat" ${ui.dtOuv && ui.dtOuv[g] === false ? "" : "open"} data-dos="${esc(g)}"><summary><span>📁 ${esc(g)}</span><span class="cat-n">${ds.length}</span></summary><div class="cat-body">${ds.map(d =>
      `<div class="note" style="--bar:#ffd650;margin-bottom:6px"><button class="note-main" data-o="dtVoir" data-id="${d.id}" style="flex:1;text-align:left;padding:10px 12px;min-width:0">
        <b class="note-client" style="display:block;font-size:15px;white-space:normal">📄 ${esc(d.nom)}</b><span class="note-adr">${dtPoids(d.taille || 0)}${d.fixe ? " · fourni avec l'appli" : ""}</span></button>
        ${d.fixe ? "" : `<button class="note-menu" data-o="dtMenu" data-id="${d.id}" aria-label="Options">⋯</button>`}</div>`).join("")}</div></details>`; }).join("")
    + `<p class="tb-aide" style="margin-top:12px">${L.length} document${L.length > 1 ? "s" : ""} · ${dtPoids(L.reduce((a, d) => a + (d.taille || 0), 0))} dans l'appli.</p>`;
}
function dtDossierChamp(val){ const connus = [...new Set([...(DT.liste || []).map(d => d.dossier).filter(Boolean), ...DT_DOSSIERS])];
  return `<label class="f"><span>Dossier</span><input class="t" id="dtDos" value="${esc(val || "")}" placeholder="Ex. Schémas" autocomplete="off"></label>
    <div class="tb-larg" style="margin:-4px 0 12px">${connus.map(g => `<button class="chip" data-g="${esc(g)}">${esc(g)}</button>`).join("")}</div>`; }
function dtBrancheDossier(s){ s.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { s.querySelector("#dtDos").value = b.dataset.g; }); }
function dtNewSheet(){
  const s = sheet(`<h3>Ajouter des PDF</h3>
    <p style="font-size:13.5px;color:var(--muted);margin:-4px 0 10px">Choisis d'abord le dossier, puis les fichiers. Tu peux en prendre plusieurs d'un coup.</p>
    ${dtDossierChamp(ui.dtDernier || "")}
    <label class="btn tb-file"><input type="file" accept="application/pdf,.pdf" multiple id="dtF">📄 Choisir les PDF</label>`);
  dtBrancheDossier(s);
  s.querySelector("#dtF").onchange = async e => { const fs = [...e.target.files].filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)); if(!fs.length){ toast("Choisis des fichiers PDF"); return; }
    const dossier = s.querySelector("#dtDos").value.trim() || "Divers"; ui.dtDernier = dossier; closeSheet(); toast("Copie dans l'appli…");
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }catch(_){}
    let ok = 0; for(const f of fs){ try{ const buf = await f.arrayBuffer(), id = uid();
        await dtReq("readwrite", tx => { tx.objectStore("pdf").put(buf, id); return tx.objectStore("meta").put({id, nom: f.name.replace(/\.pdf$/i, ""), dossier, taille: f.size, cree: Date.now()}); }); ok++; }catch(_){} }
    toast(ok === fs.length ? `${ok} document${ok > 1 ? "s" : ""} ajouté${ok > 1 ? "s" : ""}` : `${ok} sur ${fs.length} ajoutés : plus assez de place sur le téléphone ?`);
    dtCharger().then(dtDessine); };
}
function dtMenuSheet(d){
  const s = sheet(`<h3>${esc(d.nom)}</h3>
    <label class="f"><span>Nom</span><input class="t" id="dtNom" value="${esc(d.nom)}" autocomplete="off"></label>
    ${dtDossierChamp(d.dossier || "")}
    <div class="row2"><button class="btn sec danger-t" data-s="del" style="flex:0 0 auto;width:auto;padding:0 14px">🗑</button><button class="btn" data-s="ok">Enregistrer</button></div>`);
  dtBrancheDossier(s);
  s.querySelector('[data-s="del"]').onclick = () => confirmSheet(`Supprimer « ${esc(d.nom)} » de l'appli ?`, "Supprimer", () => {
    dtReq("readwrite", tx => { tx.objectStore("pdf").delete(d.id); return tx.objectStore("meta").delete(d.id); }).then(() => { closeSheet(); dtCharger().then(dtDessine); }); });
  s.querySelector('[data-s="ok"]').onclick = () => { const nom = s.querySelector("#dtNom").value.trim(); if(!nom){ toast("Donne un nom"); return; }
    d.nom = nom; d.dossier = s.querySelector("#dtDos").value.trim() || "Divers";
    dtReq("readwrite", tx => tx.objectStore("meta").put(d)).then(() => { closeSheet(); dtCharger().then(dtDessine); }); };
}
const PDFJS_URLS = [["pdf.min.js", "pdf.worker.min.js"], ["https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"]];
function chargerPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  const essai = i => new Promise((ok, ko) => { if(i >= PDFJS_URLS.length) return ko(new Error("Réseau"));
    const sc = document.createElement("script"); sc.src = PDFJS_URLS[i][0];
    sc.onload = () => { if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_URLS[i][1]; ok(pdfjsLib); } else essai(i + 1).then(ok, ko); };
    sc.onerror = () => { sc.remove(); essai(i + 1).then(ok, ko); }; document.head.appendChild(sc); });
  return essai(0);
}
async function dtVoir(d){
  const v = document.createElement("div"); v.className = "pdfview"; v.id = "pdfview";
  v.innerHTML = `<header class="top"><button class="retour" data-pv="close" aria-label="Fermer">‹</button><h1>${esc(d.nom)}</h1></header>
    <div class="pv-pages"><p class="muted" style="text-align:center;margin-top:40px">Ouverture…</p></div>
    <div class="bottom"><button class="btn sec" data-pv="dl">⬇ Télécharger</button><button class="btn" data-pv="share">Ouvrir / partager</button></div>`;
  document.body.appendChild(v); document.body.classList.add("pv-open");
  let pdf = null, obs = null;
  const fermer = () => { if(obs) obs.disconnect(); if(pdf) try{ pdf.destroy(); }catch(_){} v.remove(); document.body.classList.remove("pv-open"); };
  v.querySelector('[data-pv="close"]').onclick = fermer;
  const box = v.querySelector(".pv-pages"), rate = msg => { box.innerHTML = `<p class="muted" style="text-align:center;margin-top:40px">${msg}</p>`; };
  let buf; try{ buf = d.url ? await fetch(d.url).then(r => { if(!r.ok) throw 0; return r.arrayBuffer(); }) : await dtReq("readonly", tx => tx.objectStore("pdf").get(d.id)); }catch(e){}
  if(!buf){ rate(d.url ? "Document indisponible : ouvre-le une première fois avec du réseau." : "Fichier introuvable dans l'appli"); return; }
  const blob = new Blob([buf], {type: "application/pdf"}), nom = d.nom.replace(/[\\/:*?"<>|]/g, " ").trim() + ".pdf";
  const sortir = async mode => { const cadre = window.top !== window.self;
    if(mode === "share" && !cadre && navigator.share && window.File){ const f = new File([blob], nom, {type: "application/pdf"});
      if(!navigator.canShare || navigator.canShare({files: [f]})){ try{ await navigator.share({files: [f], title: d.nom}); }catch(e){ if(!e || e.name !== "AbortError") telechargerBlob(blob, nom); } return; } }
    if(cadre && window.claude && claude.use){ const dl = await claude.use("downloads"); if(dl){ try{ await dl.save({filename: nom, data: blob}); }catch(e){ if(!e || e.code !== "declined") toast("Téléchargement impossible ici"); } return; } }
    telechargerBlob(blob, nom); };
  v.querySelector('[data-pv="dl"]').onclick = () => sortir("dl"); v.querySelector('[data-pv="share"]').onclick = () => sortir("share");
  try{
    const lib = await chargerPdfJs(); pdf = await lib.getDocument({data: buf.slice(0)}).promise; if(!v.isConnected){ pdf.destroy(); return; }
    box.innerHTML = ""; const larg = Math.min(640, box.clientWidth - 28), dpr = Math.min(3, window.devicePixelRatio || 2);
    const p1 = await pdf.getPage(1), v1 = p1.getViewport({scale: 1}), ratio = v1.height / v1.width;
    obs = new IntersectionObserver(es => es.forEach(async en => { if(!en.isIntersecting || en.target.dataset.fait) return; const cv = en.target; cv.dataset.fait = "1";
      try{ const pg = await pdf.getPage(+cv.dataset.n), vp0 = pg.getViewport({scale: 1}), vp = pg.getViewport({scale: larg * dpr / vp0.width});
        cv.width = Math.round(vp.width); cv.height = Math.round(vp.height); cv.style.aspectRatio = vp.width + " / " + vp.height; cv.style.height = "auto";
        await pg.render({canvasContext: cv.getContext("2d"), viewport: vp}).promise; }catch(_){ delete cv.dataset.fait; } }), {root: box, rootMargin: "600px 0px"});
    for(let n = 1; n <= pdf.numPages; n++){ const cv = document.createElement("canvas"); cv.className = "pv-page"; cv.dataset.n = n; cv.style.background = "#fff"; cv.style.height = Math.round(larg * ratio) + "px"; box.appendChild(cv); obs.observe(cv); }
  }catch(e){ rate("Aperçu impossible ici. Utilise « Ouvrir / partager » pour lire le PDF."); }
}

document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-o]"); if(!b) return;
  const a = b.dataset.o, id = b.dataset.id;
  if(a === "listes" || a === "codes" || a === "doct"){ go(a); return; }
  if(a === "jeu"){ const o = document.createElement("div"); o.className = "tb-ap jeu-v";
    o.innerHTML = `<div class="tb-ap-h"><button data-x aria-label="Retour à l'appli">‹</button><div><b>Atelier câblage</b></div></div><iframe src="atelier-cablage.html" title="Atelier câblage" allow="fullscreen"></iframe>`;
    document.body.appendChild(o); document.body.classList.add("pv-open"); o.querySelector("[data-x]").onclick = () => { o.remove(); document.body.classList.remove("pv-open"); }; return; }
  if(a === "liste"){ go("liste", {lid: id}); return; }
  if(a === "listeNew"){ const l = {id: uid(), kind: "liste", titre: "", cree: Date.now(), maj: Date.now(), lignes: [{id: uid(), txt: "", ok: false}]}; listes.push(l); lsSave(l); go("liste", {lid: l.id}); const t = document.getElementById("lsTitre"); if(t) t.focus(); return; }
  if(a === "listeSuppr"){ const l = listes.find(x => x.id === id); if(!l) return;
    confirmSheet(`Supprimer la liste « ${esc(l.titre || "sans titre")} » ?`, "Supprimer", () => { listes = listes.filter(x => x !== l); lsSave(); cloudSave(l.id); closeSheet(); render(); }); return; }
  if(a === "codeNew"){ codeSheet(); return; }
  if(a === "codeEdit" || a === "codeCopie"){ const c = codes.find(x => x.id === b.closest("[data-cid]").dataset.cid); if(!c) return;
    if(a === "codeEdit"){ codeSheet(c); return; }
    const x = (c.lignes || []).filter(v => v.val)[+b.dataset.k]; if(!x) return;
    try{ navigator.clipboard.writeText(x.val).then(() => toast("Code copié"), () => {}); }catch(_){} return; }
  if(a === "dtNew"){ dtNewSheet(); return; }
  if(a === "dtVoir" || a === "dtMenu"){ const d = (DT.liste || []).find(x => x.id === id); if(!d) return; a === "dtVoir" ? dtVoir(d) : dtMenuSheet(d); return; }
  const l = lsCur(); if(!l) return;
  const row = b.closest("[data-lid]"), x = row && l.lignes.find(v => v.id === row.dataset.lid);
  if(a === "lsAdd") lsAjoute(l);
  else if(a === "lsCoche" && x){ x.ok = !x.ok; lsSave(l); row.classList.toggle("ok", x.ok); b.textContent = x.ok ? "✓" : ""; const h = document.querySelector("header.top"); if(!!h.querySelector('[data-o="lsVider"]') !== l.lignes.some(v => v.ok)){ const y = window.scrollY; renderListe(); window.scrollTo(0, y); } }
  else if(a === "lsSuppr" && x){ l.lignes = l.lignes.filter(v => v !== x); lsSave(l); row.remove(); }
  else if(a === "lsVider"){ l.lignes = l.lignes.filter(v => !v.ok); lsSave(l); renderListe(); }
});
document.addEventListener("toggle", e => { const d = e.target; if(d.dataset && d.dataset.dos){ (ui.dtOuv = ui.dtOuv || {})[d.dataset.dos] = d.open; } }, true);

listes = oLoad(LS_KEY); codes = oLoad(CD_KEY);
tabs = tbLoad();
try{ const v = JSON.parse(localStorage.getItem(KEY+"-vue"));
  if(v && v.name === "devis" && db.devis.some(d => d.id === v.id)) view = v; }catch(e){}
render();
initCloud();

/* Hors ligne (seulement si la page est servie en https, hors aperçu) */
if("serviceWorker" in navigator && location.protocol === "https:" && window.top === window.self){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
