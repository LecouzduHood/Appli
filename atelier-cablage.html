<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Atelier câblage AZEREM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Même thème que l'appli AZEREM : gris anthracite, néon violet et cyan, chrome bleu, grille rétro. Police système, titres en italique gras. */
:root{
  --bg:#2b2c31; --card:rgba(54,55,62,.94); --card2:#3d3a52; --ink:#f3f3f7; --mute:#b4b4c2; --line:#4b4c56;
  --primary:#e04cf5; --accent:#46dcf6; --bad:#ff5c7a; --ok:#46dcf6; --gold:#ffd84a;
  --chrome-v:linear-gradient(180deg,#bfe0ff 0%,#5a86ff 46%,#2fb5e8 54%,#8ff5ff 100%);
  --btn:linear-gradient(100deg,#4a2bb0,#b03ee0 70%,#f06cf5);
  --glow:0 0 0 1px rgba(70,220,246,.55),0 0 14px rgba(70,220,246,.35);
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* L'écran de l'appli est figé : rien ne dépasse, rien ne glisse. Seules les listes défilent, seul le terrain de jeu se zoome. */
html,body{height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 var(--f-ui);position:fixed;inset:0;width:100%;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.defs{position:absolute;width:0;height:0;overflow:hidden}
/* Fond : halo violet en haut, halo cyan en bas, grille rétro en perspective très discrète */
.screen{position:fixed;top:0;bottom:0;left:0;right:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;isolation:isolate;overflow:hidden;
  background:radial-gradient(120% 50% at 50% 0%,rgba(74,43,176,.22),transparent 60%),radial-gradient(90% 40% at 50% 110%,rgba(70,220,246,.12),transparent 65%),var(--bg)}
.screen::after{content:"";position:absolute;left:-50%;right:-50%;bottom:0;height:38%;z-index:-1;pointer-events:none;opacity:.14;
  background-image:linear-gradient(rgba(224,76,245,.9) 1px,transparent 1px),linear-gradient(90deg,rgba(224,76,245,.9) 1px,transparent 1px);
  background-size:44px 44px;transform:perspective(320px) rotateX(62deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* En-têtes, comme dans l'appli : dégradé indigo, lueur rose, grille cyan, logo chromé */
.hero,.top{position:relative;flex:none;overflow:hidden;display:flex;align-items:center;gap:10px;min-height:50px;padding-top:6px;padding-bottom:6px;
  background:radial-gradient(80% 140% at 50% 0%,rgba(224,76,245,.35),transparent 70%),linear-gradient(180deg,#1a1440,#2b2c31);
  border-bottom:1px solid rgba(224,76,245,.45);box-shadow:0 6px 24px rgba(224,76,245,.18);z-index:2}
.hero::after,.top::after{content:"";position:absolute;left:-40%;right:-40%;bottom:-2px;height:70%;pointer-events:none;opacity:.35;z-index:0;
  background-image:linear-gradient(rgba(70,220,246,.8) 1px,transparent 1px),linear-gradient(90deg,rgba(70,220,246,.8) 1px,transparent 1px);
  background-size:36px 36px;transform:perspective(220px) rotateX(60deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent)}
.hero>*,.top>*{position:relative;z-index:1}
.hero-txt{flex:1;min-width:0}
.hero-sub{font-weight:800;font-style:italic;letter-spacing:.18em;text-transform:uppercase;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:0 0 8px rgba(70,220,246,.7)}
.hero-date{margin-top:1px;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-logo{display:block;height:34px;width:auto;flex:none;filter:drop-shadow(0 0 6px rgba(224,76,245,.45))}
.hero-logo.s{height:28px}
.retour{flex:none;width:38px;height:34px;font-size:22px;line-height:1;font-weight:700;color:#fff;background:rgba(224,76,245,.18);box-shadow:inset 0 0 0 1px rgba(224,76,245,.6);border-radius:10px;padding:0 0 2px}
.retour:active,.hbtn:active{background:rgba(224,76,245,.35)}
.top h2{flex:1;min-width:0;margin:0;font-size:17px;font-weight:800;font-style:italic;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 10px rgba(224,76,245,.5)}
.hbtn{flex:none;height:34px;padding:0 12px;border-radius:10px;font-weight:700;font-size:13px;color:#fff;background:rgba(224,76,245,.18);box-shadow:inset 0 0 0 1px rgba(224,76,245,.6)}

/* Accueil */
.scroll{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;padding-top:14px;padding-bottom:16px}
.art{position:relative;flex:1 1 200px;min-height:150px;max-height:260px;border-radius:18px;overflow:hidden;background:#120e2a;border:1px solid rgba(224,76,245,.55);box-shadow:0 6px 24px rgba(224,76,245,.22)}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art h1{position:absolute;left:14px;top:10px;margin:0;font-weight:800;font-style:italic;font-size:clamp(30px,10vw,42px);line-height:.95;letter-spacing:.01em;text-transform:uppercase;
  background:var(--chrome-v);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.35);
  filter:drop-shadow(0 0 2px #e04cf5) drop-shadow(0 0 10px rgba(224,76,245,.75)) drop-shadow(0 2px 0 rgba(20,10,60,.9))}
.modes{display:flex;flex-direction:column;gap:12px;flex:none}
.mode{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:18px;color:var(--ink);
  background:linear-gradient(160deg,rgba(224,76,245,.22),rgba(70,220,246,.08));border:1px solid rgba(224,76,245,.45);box-shadow:0 6px 20px rgba(224,76,245,.15)}
.mode.m-ac{background:linear-gradient(160deg,rgba(224,76,245,.4),rgba(90,60,220,.25))}
.mode.m-acx{background:linear-gradient(160deg,rgba(255,216,74,.2),rgba(224,76,245,.3));border-color:rgba(255,216,74,.6);box-shadow:0 6px 20px rgba(255,216,74,.12)}
.mode.m-acx svg{filter:drop-shadow(0 0 5px rgba(255,216,74,.9))}
.mode.m-dc{background:linear-gradient(160deg,rgba(70,220,246,.22),rgba(70,120,246,.08));border-color:rgba(70,220,246,.5);box-shadow:0 6px 20px rgba(70,220,246,.12)}
.mode:active{background:#3d3a52}
.mode svg{width:44px;height:44px;flex:none;filter:drop-shadow(0 0 5px rgba(224,76,245,.9))}
.mode.m-dc svg{filter:drop-shadow(0 0 5px rgba(70,220,246,.9))}
.mode span{flex:1;min-width:0}
.mode b{display:block;font-size:16px;font-weight:700;line-height:1.2}
.mode small{color:var(--mute);font-size:12px;display:block;margin-top:2px}
.mode em{font-style:italic;font-weight:800;text-align:right;font-size:17px;color:#fff;white-space:nowrap;line-height:1.15;text-shadow:0 0 8px rgba(70,220,246,.7)}
.mode em i{display:block;font-style:normal;font-weight:500;font-size:11.5px;color:var(--gold);text-shadow:none}
.foot{color:var(--mute);font-size:11.5px;margin:0 2px}

/* Liste des niveaux : cartes façon « notes » de l'appli */
.list{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-top:14px;padding-bottom:20px;display:flex;flex-direction:column;gap:10px}
.lv{display:flex;align-items:stretch;gap:6px}
.lvb{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 10px 6px 10px;text-align:left;box-shadow:inset 4px 0 0 #7b5cff}
.lv.done .lvb{box-shadow:inset 4px 0 0 var(--primary)}
.lvb:active{background:#3d3a52}
.lvb:disabled{opacity:.5;box-shadow:inset 4px 0 0 #5a5b66}
.th{width:76px;height:58px;border-radius:9px;flex:none;overflow:hidden;position:relative;background:#16171b;border:1px solid rgba(0,0,0,.6)}
.th svg{width:100%;height:100%;display:block}
.th .rep{position:absolute;left:4px;top:4px;font-weight:800;font-style:italic;font-size:12px;min-width:20px;padding:0 4px;text-align:center;border-radius:6px;background:rgba(20,16,50,.85);color:#fff;line-height:18px}
.lv.done .rep{background:linear-gradient(135deg,#b03ee0,#f06cf5)}
.lv .tt{flex:1;min-width:0}
.lv b{display:block;font-weight:600;line-height:1.2}
.lv small{color:var(--mute);font-size:12px;display:block;margin-top:2px}
.stars{font-size:13px;letter-spacing:1px;color:var(--gold);white-space:nowrap;text-shadow:0 0 8px rgba(255,216,74,.45)}
.stars i{font-style:normal;color:#55566a;text-shadow:none}
.fiche{border-radius:12px;padding:0 11px;font-size:12px;font-weight:700;background:rgba(224,76,245,.08);color:var(--primary);box-shadow:inset 0 0 0 1px rgba(224,76,245,.45)}

/* Niveau */
.status{display:flex;align-items:center;gap:12px;padding-top:6px;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--mute)}
.status #clock{font-weight:800;font-style:italic;font-size:19px;color:#fff;min-width:56px;text-shadow:0 0 10px rgba(70,220,246,.6)}
.status #best{flex:1}
.status #lives{font-size:16px;letter-spacing:2px;white-space:nowrap;filter:drop-shadow(0 0 5px rgba(255,216,74,.5))}
.status #lives i{font-style:normal;opacity:.2;filter:grayscale(1)}
.mission{padding-top:4px;padding-bottom:7px;font-size:13.5px;line-height:1.35}
.boardwrap{flex:1;min-height:0;display:flex}
.board{flex:1;min-width:0;position:relative;overflow:hidden;border-radius:16px;border:1px solid rgba(224,76,245,.6);background:#16171b;box-shadow:0 0 20px rgba(224,76,245,.22)}
.board svg{position:absolute;inset:0;width:100%;height:100%}
#svg{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.alarm{position:absolute;left:8px;right:8px;top:8px;background:linear-gradient(100deg,#c81e5a,#ff2a6d);color:#fff;border-radius:12px;padding:7px 10px;font-weight:700;font-size:13px;text-align:center;pointer-events:none;box-shadow:0 4px 18px rgba(255,42,109,.45)}
.alarm small{display:block;font-weight:400;font-size:12px;opacity:.95}
.toast{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:#3d3a52;color:#fff;border-radius:20px;padding:5px 12px;font-size:13px;font-weight:500;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;pointer-events:none;box-shadow:var(--glow)}
.trash{position:absolute;left:8px;right:8px;bottom:8px;height:46px;border:2px dashed var(--bad);border-radius:12px;background:rgba(255,92,122,.2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:#ffd9e0;pointer-events:none}
.trash.hot{background:rgba(255,92,122,.6);color:#fff}
.banner{position:absolute;left:0;right:0;top:10px;margin:0 auto;width:max-content;max-width:92%;padding:5px 18px 6px;border-radius:14px;background:rgba(26,20,64,.9);border:1px solid var(--accent);text-align:center;
  font-weight:800;font-style:italic;font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:#fff;text-shadow:0 0 12px rgba(70,220,246,.9);box-shadow:var(--glow),0 6px 24px rgba(0,0,0,.5);pointer-events:none;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.zap{animation:zap .5s}
@keyframes zap{0%,40%{box-shadow:inset 0 0 0 400px rgba(255,160,240,.75)}100%{box-shadow:0 0 20px rgba(224,76,245,.22)}}
.spools{display:flex;gap:5px;padding-top:8px;padding-bottom:4px}
.spool{flex:1;min-width:0;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mute);line-height:1.1}
.spool span{width:26px;height:26px;border-radius:50%;border:2px solid rgba(0,0,0,.4);box-shadow:inset 0 0 0 6px rgba(255,255,255,.16),0 0 0 1px rgba(255,255,255,.15)}
.spool.auto span{display:flex;align-items:center;justify-content:center;font-weight:800;font-style:italic;font-size:14px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);background:conic-gradient(#e23a32,#f08a00,#f5d000,#2e9e44,#2f7ff0,#a05ad8,#e23a32);box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.spool.cur{border-color:rgba(70,220,246,.7);color:#fff}
.spool.cur span{box-shadow:inset 0 0 0 6px rgba(255,255,255,.16),0 0 0 2px #46dcf6,0 0 10px rgba(70,220,246,.7)}
.spool[aria-pressed="true"]{border-color:var(--accent);color:#fff;font-weight:600;background:#3d3a52;box-shadow:var(--glow)}
.acts{display:flex;gap:8px;padding-top:6px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.acts button{flex:1;min-height:42px;border-radius:12px;padding:0 8px;font-weight:700;font-size:14px;background:rgba(224,76,245,.08);color:var(--primary);box-shadow:inset 0 0 0 1px rgba(224,76,245,.45)}
.acts .go,.sheet .row .go{flex:1.5;background:var(--btn);color:#fff;font-weight:800;letter-spacing:.02em;text-shadow:0 1px 2px rgba(10,6,50,.5);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 4px 16px rgba(224,76,245,.28)}
.acts #clear.del{color:#ff8fa3;background:rgba(255,92,122,.12);box-shadow:inset 0 0 0 1px rgba(255,92,122,.6)}
.acts button:active,.sheet .row button:active{filter:brightness(1.25)}

/* Feuilles */
.sheet{position:fixed;inset:0;background:rgba(5,2,20,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:#303137;width:100%;max-width:560px;border-radius:18px 18px 0 0;border-top:1px solid rgba(70,220,246,.5);box-shadow:0 -6px 30px rgba(70,220,246,.25);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:82%;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet h3{font-size:20px;font-weight:800;font-style:italic;margin:0 0 8px;line-height:1.15}
.sheet h3.ok{color:var(--ok);text-shadow:0 0 12px rgba(70,220,246,.45)} .sheet h3.bad{color:var(--bad);text-shadow:0 0 12px rgba(255,92,122,.35)}
.sheet h4{font-size:13px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.08em;color:var(--primary);text-shadow:0 0 10px rgba(224,76,245,.35);margin:12px 0 8px}
.sheet p{margin:0 0 10px}
.time{font-weight:700;font-size:15px}
.rule{background:rgba(224,76,245,.08);box-shadow:inset 4px 0 0 var(--primary),inset 0 0 0 1px rgba(224,76,245,.25);padding:9px 12px 9px 14px;border-radius:12px;font-size:14px;margin-bottom:10px}
.rule b{font-weight:800;font-style:italic;letter-spacing:.08em;text-transform:uppercase;font-size:12px;display:block;color:var(--primary);margin-bottom:2px}
.more{color:var(--mute);font-size:13px;padding-left:18px;margin:0 0 12px}
.sheet .row{display:flex;gap:8px;margin-top:4px}
.sheet .row button{flex:1;min-height:42px;border-radius:12px;padding:0 8px;font-weight:700;font-size:14px;background:rgba(224,76,245,.08);color:var(--primary);box-shadow:inset 0 0 0 1px rgba(224,76,245,.45)}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:6px}
.bank button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;line-height:1.15;color:var(--ink)}
.bank button:active{border-color:var(--accent);box-shadow:var(--glow)}
.bank svg{width:100%;height:58px;pointer-events:none}


/* Mode expert : état de l'installation, consigne, testeur, contrôles */
.chip{flex:none;font-weight:800;font-style:italic;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px;color:#fff;white-space:nowrap}
.chip.live{background:#c8102e;box-shadow:0 0 12px rgba(255,42,109,.7);animation:pulse 1.1s ease-in-out infinite}
.chip.off{background:#6b4a00;box-shadow:inset 0 0 0 1px #ffd84a;color:#ffe9a8}
.chip.safe{background:#0d5c3a;box-shadow:inset 0 0 0 1px #3ddc84;color:#c4ffdd}
.mission.x{display:flex;align-items:center;gap:8px;min-height:62px;padding-top:5px;padding-bottom:6px}
.gd{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.32}
.gd b{display:inline-block;font-style:italic;font-weight:800;color:#1a1440;background:var(--accent);border-radius:8px;padding:0 6px;margin-right:3px;font-size:11.5px;line-height:17px}
.ckb{flex:none;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 11px;border-radius:12px;font-weight:700;font-size:12px;color:#fff;background:rgba(70,220,246,.12);box-shadow:inset 0 0 0 1px rgba(70,220,246,.6)}
.ckb i{font-style:normal;font-weight:800;font-size:13px;color:var(--accent)}
.ckb:active{background:rgba(70,220,246,.3)}
.thumb{position:absolute;right:3px;width:4px;border-radius:3px;background:rgba(224,76,245,.8);box-shadow:0 0 6px rgba(224,76,245,.8);pointer-events:none}
.meter{position:absolute;left:8px;right:12px;bottom:8px;display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:12px;background:rgba(18,14,42,.95);border:1px solid var(--accent);box-shadow:var(--glow);pointer-events:none}
.lcd{flex:none;min-width:96px;text-align:right;padding:3px 8px;border-radius:7px;background:#b8e6bf;color:#0c2a14;font:800 24px/1.15 ui-monospace,Menlo,Consolas,monospace;box-shadow:inset 0 0 0 1px #5d7a66,inset 0 2px 5px rgba(0,0,0,.25);white-space:nowrap}
.pts{flex:1;min-width:0;font-size:11.5px;line-height:1.32;color:#d9d9e6}
.pts span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.pts i.r{background:#ff3b30} .pts i.k{background:#15171a;box-shadow:0 0 0 1px #fff}
.pts .nt{font-weight:700;color:var(--gold)} .pts .nt.ok{color:#7df2aa} .pts .nt.bad{color:#ff8fa3}
.board.probing .toast{bottom:74px}
.acts.four{gap:6px}
.acts.four button{font-size:13px;padding:0 4px;line-height:1.12}
.acts.four .go{flex:1.25}
.acts #probe.on{background:rgba(70,220,246,.22);color:#fff;box-shadow:var(--glow)}
.proc{margin:4px 0 0;padding-left:20px;font-size:13.5px}
.proc li{padding:1px 0;color:var(--mute)} .proc li.ok{color:#8fe8c0} .proc li.now{color:#fff;font-weight:700}
.cks{list-style:none;margin:4px 0 0;padding:0;font-size:13px}
.cks li{position:relative;padding:4px 0 4px 26px;color:var(--mute)}
.rule .cks li b{display:block;color:#fff;font-size:13.5px;font-style:normal;font-weight:700;letter-spacing:0;text-transform:none;margin:0}
.cks li::before{content:"";position:absolute;left:2px;top:6px;width:15px;height:15px;border-radius:5px;box-shadow:inset 0 0 0 1.5px #7c7d8c}
.cks li.ok::before{content:"✓";background:var(--accent);color:#1a1440;font-weight:800;font-size:12px;line-height:15px;text-align:center;box-shadow:none}
.hintx{color:var(--mute);font-size:12.5px}
.warn{font-weight:700;color:var(--gold)}
/* Bouton de cadrage du terrain de jeu */
.zfit{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#cfd3ea;background:rgba(18,14,42,.72);box-shadow:inset 0 0 0 1px rgba(224,76,245,.4);z-index:1}
.zfit svg{position:static;width:20px;height:20px}
.zfit.on{color:#fff;box-shadow:var(--glow)}
.zfit:active{filter:brightness(1.3)}
/* Dessin */
.hit{fill:transparent}
.lb{font:700 8.5px var(--f-body);fill:#33414f;text-anchor:middle}
.lb.lt{fill:#e6edf5}
.cap{font:600 10.5px var(--f-body);fill:#fff;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#0b1118;stroke-width:3px;stroke-linejoin:round}
.big{font:700 13px var(--f-disp);fill:#1f2a34;text-anchor:middle;letter-spacing:.02em}
.sm{font:700 6.6px var(--f-body);fill:#4a5866;text-anchor:middle}
.tw{font:700 12.5px var(--f-disp);fill:#fff;text-anchor:middle;letter-spacing:.05em;text-transform:uppercase}
.sct{font-family:var(--f-disp);font-weight:700;text-anchor:middle}
.sel{fill:none;stroke:var(--accent);stroke-width:3}
.wh{fill:none;stroke:rgba(4,8,12,.6);stroke-width:7.4;stroke-linecap:round;stroke-linejoin:round}
.wh.l{stroke:rgba(255,255,255,.6)}
.wr{fill:none;stroke-width:4.8;stroke-linecap:round;stroke-linejoin:round}
.ws{fill:none;stroke:rgba(255,255,255,.28);stroke-width:1.2;stroke-linecap:round;transform:translate(-.9px,-.9px)}
.wx{fill:none;stroke:transparent;stroke-width:18}
.wsel{fill:none;stroke:#46dcf6;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.lo{opacity:0;transition:opacity .7s}
.dk{opacity:.6;transition:opacity .7s}
.th .dk{opacity:.5}
.th.lit .lo:not([data-off]){opacity:1} .th.lit .dk{opacity:0}
.spin{animation:spin 1s linear infinite;transform-box:fill-box;transform-origin:center}
.spin.rev{animation-direction:reverse} .spin.slow{animation-duration:3.2s}
.pulse{animation:pulse 1s ease-in-out infinite}
.blink{animation:blink 1s linear infinite} .blink2{animation:blink2 1s linear infinite}
.hw{animation:hw 7s linear infinite;opacity:0}
.note{animation:note 2.4s ease-in-out infinite} .n2{animation-delay:1.2s}
.flow{stroke-dasharray:6 8;animation:flow 1s linear infinite}
.beam{transform-box:view-box;transform-origin:256px 198px;animation:beam 5s ease-in-out infinite alternate}
.gate,.gate2,.bridge{transition:transform 1.4s ease-in-out;transform-box:view-box}
.gate[data-s="1"],.gate[data-s="-1"]{transform:translateX(-124px)}
.gate2[data-s="1"],.gate2[data-s="-1"]{transform:translateX(112px)}
.bridge{transform-origin:180px 382px}
.shut{transition:transform 2.6s linear;transform:translateY(-68px)}
.shut[data-s="-1"]{transform:translateY(0)}
.shut[data-s="1"]{transform:translateY(-68px)}
.bridge[data-s="1"]{transform:scaleY(-1.3)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.3}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.1}}
@keyframes blink2{0%,49%{filter:none}50%,100%{filter:brightness(.55)}}
@keyframes hw{0%,10%{opacity:0}14%,86%{opacity:1}90%,100%{opacity:0}}
@keyframes note{0%{transform:translateY(6px);opacity:0}40%{opacity:1}100%{transform:translateY(-12px);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes beam{from{transform:rotate(-12deg)}to{transform:rotate(16deg)}}
@media (prefers-reduced-motion:reduce){.spin,.pulse,.blink,.blink2,.note,.flow,.beam,.banner{animation:none}.hw{animation:none;opacity:1}}

function gauss(A,n){

function settle(devs,wires,st,seen){

    r=compute(devs,wires,st); if(seen) seen(r);
    let ch=false;

      if(d.type==='tele'){ const e=Math.abs(r.flag[i+':coil']||0)>=160?1:0; if(e&&!st[i+':c']){ st[i]=st[i]?0:1; ch=true; } st[i+':c']=e; }

      else if(d.type==='cont'){ const e=Math.abs(r.flag[i+':coil']||0)>=160?1:0; if(e!==(st[i+':c']||0)){ st[i+':c']=e; ch=true; } }

  const srcs=devs.filter(d=>T[d.type].src);
  const LN=d=>T[d.type].load&&PAIR[d.type][0]==='L';
  const seen=q=>{ if(q.fault&&!fault) fault=q.fault; obs++;
    const P=new Set(),N=new Set(),E=new Set();
    for(const d of srcs){ if(T[d.type].ac){ P.add(q.find(d.id+'.L')); N.add(q.find(d.id+'.N')); E.add(q.find(EARTH)); } else { P.add(q.find(d.id+'.p')); N.add(q.find(d.id+'.m')); } }
    S={P,N,E};
    wires.forEach((w,i)=>{ const k=q.find(w.a); if(P.has(k)) flags[i].p++; if(N.has(k)) flags[i].n++; if(E.has(k)) flags[i].e++; }); };
  const go=()=>{ r=settle(devs,wires,st,seen); };
  for(const s of tests){
    Object.assign(st,s.do||{}); go();
    if(s.press){ st[s.press]=1; go(); st[s.press]=0; go(); }
    if(s.expire){ st[s.expire]=0; go(); }
    if(s.hold){ st[s.hold]=1; go(); }
    if(s.code&&powered(r,s.code)){ st[s.code]=1; go(); }
    if(s.detect&&acOn(r,s.detect)){ st[s.detect]=1; go(); }
    for(const id in s.expect){ const d=devs.find(x=>x.id===id), want=s.expect[id], got=r.on[id]?1:0;
      const exp=want==='any'?got:want==='toggle'?(prev[id]?0:1):want, w=WORDS[d.type];
      if(got!==exp&&!fn.length) fn.push({t:'Le montage ne fonctionne pas',
        x:s.say||`${s.ctx} : ${d.name} devrait être ${w[exp?0:1]}, pas ${w[got?0:1]}.`+(exp&&r.lv[id]==='dim'?' Le récepteur ne reçoit qu\'une partie de sa tension.':'')});
      prev[id]=got;
      const [ta,tb]=PAIR[d.type], a=r.find(id+'.'+ta), b=r.find(id+'.'+tb);
      if(ac&&LN(d)&&!exp&&!got&&r.lv[id]==='off'&&a!==b&&(S.P.has(a)||S.P.has(b))&&!(s.dead||[]).includes(id)&&!cut.length)
        cut.push({t:'C\'est le neutre qui est coupé',x:`${s.ctx} : ${d.name} est ${w[1]} mais reste sous tension. L'appareil de commande doit couper la phase, pas le neutre, pour intervenir sans risque.`});
      if(ac&&LN(d)&&got&&S.P.has(r.find(id+'.N'))&&!pol.length)
        pol.push({t:'Phase et neutre inversés',x:`${cap(d.name)} fonctionne, mais la phase arrive sur la borne N et le neutre sur la borne L. Respecte le repérage des bornes.`});
    }
    for(const id in (s.dir||{})){ const d=devs.find(x=>x.id===id), got=r.on[id]?r.dir[id]:0, want=s.dir[id];
      if(want==='toggle'&&got&&got===pdir[id]&&!fn.length) fn.push({t:'Le sens ne s\'inverse pas',x:s.say||`${s.ctx} : ${d.name} devrait tourner dans l'autre sens.`});
      if(typeof want==='number'&&got&&got!==want&&!fn.length) fn.push({t:'Le sens est inversé',x:s.say2||`${s.ctx} : ${d.name} part dans le mauvais sens. Croise les deux fils de montée et de descente.`});
      pdir[id]=got; }
    for(const id of (s.dead||[])){ const d=devs.find(x=>x.id===id), [ta,tb]=PAIR[d.type], a=r.find(id+'.'+ta), b=r.find(id+'.'+tb);
      const hot=x=>S.P.has(x)||(ac&&S.N.has(x));
      if((hot(a)||hot(b))&&!dead.length&&!fn.length) dead.push({t:'Coupure incomplète',x:s.say}); }
    if(s.hold){ st[s.hold]=0; go(); }
    if(s.code){ st[s.code]=0; go(); }
    if(s.detect){ st[s.detect]=0; go(); }
  }
  const errs=[];
  if(fault) errs.push({t:FAULT[fault.k][0],x:FAULT[fault.k][1]});
  errs.push(...fn,...dead,...cut,...pol);
  Object.assign(st,L.rest||{}); go();
  if(ac){ const noT=devs.filter(d=>T[d.type].earth&&!S.E.has(r.find(d.id+'.T')));
    if(noT.length) errs.push({t:'Terre oubliée',x:`${noT.map(d=>d.label).join(', ')} : la borne T n'est pas reliée à la terre. Le conducteur de protection vert-jaune arrive sur chaque point lumineux, chaque prise et chaque appareil.`}); }
  if(!fault){ let c=null;
    wires.forEach((w,i)=>{ if(c) return; const f=flags[i], where=`Le fil ${CNAME[w.c]} entre ${tname(L,w.a)} et ${tname(L,w.b)}`;
      if(ac){
        if(f.e){ if(w.c!=='vj') c=`${where} est un conducteur de protection : il doit être vert-jaune.`; }
        else if(f.n&&!f.p){ if(w.c!=='bleu') c=`${where} est un neutre : il doit être bleu.`; }
        else if(w.c==='bleu') c=`${where} n'est pas un neutre. Le bleu est réservé au neutre.`;
        else if(w.c==='vj') c=`${where} n'est pas une terre. Le vert-jaune est réservé au conducteur de protection, jamais autre chose.`;
      } else if(f.p===obs&&!f.n){ if(w.c!=='rouge') c=`${where} part du + : il doit être rouge.`; }
      else if(f.n===obs&&!f.p){ if(w.c!=='noir') c=`${where} revient au − : il doit être noir.`; }
    });
    if(c) errs.push({t:ac?'Couleur de fil non conforme':'Couleur de fil à revoir',
      x:c+(ac?' Les phases, retours et navettes prennent une autre couleur : rouge, marron, noir, orange, violet.':' Repère : rouge pour le +, noir pour le −. Après un contact ou entre deux composants, la couleur est libre.')}); }
  return {ok:!errs.length,errs,fault};
}

const led=(x,y,c,on,r=3.4)=>(on?`<circle cx="${x}" cy="${y}" r="${r*2.6}" fill="${c}" opacity=".28"/>`:'')+`<circle cx="${x}" cy="${y}" r="${r}" fill="${on?c:'#59636e'}" stroke="#1b2229" stroke-width=".7"/>`+(on?`<circle cx="${x-r*.3}" cy="${y-r*.3}" r="${r*.35}" fill="#fff" opacity=".8"/>`:'');
const key=(cx,k,on,w=32,h=40,cy=7)=>`<g data-k="${k}"><rect x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="4.5" fill="#bcc6d0"/>`+
  `<rect x="${cx-w/2+1.5}" y="${cy-h/2+1.5}" width="${w-3}" height="${h-3}" rx="3.5" fill="url(#gKey)" stroke="#98a4b0" stroke-width=".8"/>`+

function bulb(cy,r,lv){
  let s='';
  if(lv==='on') s+=`<circle cy="${cy}" r="${r*2.7}" fill="url(#gGlow)"/>`;
  else if(lv==='dim') s+=`<circle cy="${cy}" r="${r*1.8}" fill="url(#gGlow)" opacity=".3"/>`;
  s+=`<rect x="-6.5" y="${cy-r-9}" width="13" height="11" rx="2" fill="url(#gMetal)" stroke="#5e6975" stroke-width=".8"/>`+
     `<path d="M-6.5,${cy-r-5.5} h13 M-6.5,${cy-r-2.5} h13" stroke="#5e6975" stroke-width=".7"/>`;
  s+=`<circle cy="${cy}" r="${r}" fill="${lv==='on'?'url(#gLit)':lv==='dim'?'#d9b673':'url(#gGlass)'}" stroke="${lv==='off'?'#8a97a4':'#d9a514'}" stroke-width="1.2"/>`;
  s+=`<path d="M-4.5,${cy-r+3} L-4,${cy+2} l2,-5 l2,5 l2,-5 l2,5 L4.5,${cy-r+3}" fill="none" stroke="${lv==='off'?'#7c8996':lv==='dim'?'#ff9d2e':'#fff'}" stroke-width="1.1" stroke-linejoin="round"/>`;
  s+=`<ellipse cx="${-r*.38}" cy="${cy-r*.38}" rx="${r*.2}" ry="${r*.34}" fill="#fff" opacity="${lv==='off'?.6:.85}" transform="rotate(35 ${-r*.38} ${cy-r*.38})"/>`;
  return s;
}

/* ----- Couleur automatique : on regarde à quoi le point de départ est déjà relié (fils, bornes, nœuds) ----- */
function netOf(ep,skip){
  const start=ep.t?[ep.t]:[wires[ep.w].a,wires[ep.w].b], seen=new Set(start), q=start.slice();
  while(q.length){ const t=q.pop(), d=t.split('.')[0], dv=dev(d), nb=[];
    wires.forEach((w,i)=>{ if(i===skip) return; if(w.a===t) nb.push(w.b); else if(w.b===t) nb.push(w.a); });
    if(dv&&isBar(dv)) terms(dv).forEach(x=>nb.push(d+'.'+x.n));
    nb.forEach(x=>{ if(!seen.has(x)){ seen.add(x); q.push(x); } }); }
  return seen;
}
function nature(ep,skip){
  const net=netOf(ep,skip), info=[...net].map(t=>{ const [d,n]=t.split('.'), dv=dev(d), tm=dv&&terms(dv).find(x=>x.n===n); return {dv,lab:tm?tm.lab:'',src:!!(dv&&T[dv.type].src)}; }).filter(i=>i.dv);
  const has=(lab,fn)=>info.some(i=>i.lab===lab&&(!fn||fn(i)));
  if(has('T')) return {c:'vj',sure:1};
  if(has('N')) return {c:'bleu',sure:1};
  const sp=has('+',i=>i.src), sm=has('−',i=>i.src);
  if(sp&&sm) return {c:'orange',sure:1};
  if(sp) return {c:'rouge',sure:1,pol:1}; if(sm) return {c:'noir',sure:1,pol:-1};
  if(has('L',i=>['src','dbr','diff','disj'].includes(i.dv.type))) return {c:'rouge',sure:1};
  const w=wires.find((w,i)=>i!==skip&&(net.has(w.a)||net.has(w.b))); if(w) return {c:w.c};
  if(has('+')&&has('−')) return null;
  if(has('+')) return {c:'rouge'}; if(has('−')) return {c:'noir'};
  if(has('L',i=>i.dv.type!=='lamp'&&i.dv.type!=='proj')) return {c:'rouge'};
  if(has('▼')) return {c:'violet'};
  return null;
}
function autoColor(A,B,skip){

}

const bsize=()=>{ const b=$('board'); return [b.clientWidth||360,b.clientHeight||470]; };
function contentRect(){
  if(!L.free) return {x0:0,y0:0,x1:360,y1:BH};
  if(!L.devs.length) return {x0:0,y0:0,x1:360,y1:470};
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; L.devs.forEach(d=>{ const k=T[d.type], w=barW(d)/2; x0=Math.min(x0,d.x-w); x1=Math.max(x1,d.x+w); y0=Math.min(y0,d.y-k.h/2); y1=Math.max(y1,d.y+k.h/2+(k.ext||0)); });
  return {x0:Math.min(x0-24,0),y0:Math.min(y0-24,0),x1:Math.max(x1+24,360),y1:Math.max(y1+34,470)};

function zoomAt(cx,cy,k,base){

function guard(){
  if(!X||!running) return true;
  if(st.dbr){ zap({k:'ST'}); return false; }
  if(!vat){ soft('Absence de tension non vérifiée : une erreur','Avant de toucher aux fils : Testeur, puis les bornes L et N du disjoncteur de branchement. Il doit afficher 0 V.'); return false; }
  return true;
}
function wireLock(){
  if(!X||!running) return false;
  if(st.dbr){ toast('Sous tension : coupe d\'abord le disjoncteur de branchement'); return true; }
  if(!vat){ toast('Vérifie d\'abord l\'absence de tension au testeur'); return true; }
  return false;
}
/* Toute action passe par ici : si elle crée un défaut, elle est annulée (et coûte un fusible en niveau). */
function act(fn){
  const snap=JSON.stringify({wires,st,devs:L.devs}), hc=hist.slice(), id0=idn; fn();
  const r=settle(L.devs,wires,st);
  if(r.fault){ const s=JSON.parse(snap); wires=s.wires; st=s.st; L.devs=s.devs; hist=hc; idn=id0; draw(); zap(r.fault); return false; }
  draw(); persistFree(); return true;
}
const push=()=>{ hist.push(JSON.stringify({wires,devs:L.devs})); if(hist.length>60) hist.shift(); };
const prune=()=>{ L.devs=L.devs.filter(d=>d.type!=='node'||wires.some(w=>w.a===d.id+'.x'||w.b===d.id+'.x')); };
function split(ep){ const w=wires[ep.w], id='j'+(++idn), t=id+'.x', k=w.k?{k:1}:{}; L.devs.push({id,type:'node',x:ep.x,y:ep.y,label:'Nœud'}); wires.splice(ep.w,1,Object.assign({a:w.a,b:t,c:w.c},k),Object.assign({a:t,b:w.b,c:w.c},k)); return t; }
function connectEP(A,B){
  selW=null;
  const onW=(t,w)=>wires[w].a===t||wires[w].b===t;
  if(A.t&&B.t){ if(A.t===B.t) return draw(); if(wires.some(w=>(w.a===A.t&&w.b===B.t)||(w.a===B.t&&w.b===A.t))){ toast('Ces deux points sont déjà reliés'); return draw(); } }
  if(A.w!==undefined&&B.w!==undefined){ if(A.w===B.w) return draw(); if(B.w>A.w) B=Object.assign({},B,{w:B.w+1}); }
  if((A.t&&B.w!==undefined&&onW(A.t,B.w))||(B.t&&A.w!==undefined&&onW(B.t,A.w))) return draw();
  if(!guard()) return draw();
  const c=auto?autoColor(A,B):color;
  act(()=>{ push(); const a=A.t||split(A), b=B.t||split(B); wires.push({a,b,c}); }); if(auto&&color!==c){ color=c; spools(); }
}
function pulse(k,ms){ if(act(()=>{ st[k]=1; })) setTimeout(()=>{ if(L&&st[k]&&dev(k)) act(()=>{ st[k]=0; }); },ms); }
function ctl(k){
  const [id,sub]=k.split(':'), d=dev(id);
  if(sub==='t'){ if(Math.abs(lastR.flag[id+':pw']||0)<160) return toast('Différentiel hors tension : le bouton test ne fait rien');
    if(st[id]){ if(act(()=>{ st[id]=0; })){ toast('Bouton test : le différentiel déclenche'); checkCtrl(k); } } else toast('Réarme d\'abord le différentiel'); }
  else if(d.type==='dbr'){ const was=st[id], v0=vat; vat=false;
    if(act(()=>{ st[id]=was?0:1; })){ if(was){ cutOnce=true; refused=false; } if(X) toast(was?(vat?'Courant coupé, absence de tension vérifiée':'Courant coupé. Vérifie l\'absence de tension au testeur'):'Installation sous tension'); }
    else vat=v0||vat;
    hud(); }
  else if(d.type==='cont') act(()=>{ st[id]=+sub.slice(1); });
  else if(d.type==='ivr') act(()=>{ const v=sub==='u'?1:2; st[id]=st[id]===v?0:v; });
  else if(d.type==='hc'){ if(act(()=>{ st[id]=st[id]?0:1; })) toast(st[id]?'Compteur : heures creuses':'Compteur : heures pleines'); }
  else if(d.type==='det'){ if(!acOn(lastR,id)) return toast('Le détecteur n\'est pas alimenté');
    if(act(()=>{ st[id]=1; })){ toast('Passage détecté'); clearTimeout(timers[id]); timers[id]=setTimeout(()=>{ delete timers[id]; if(L&&dev(id)){ st[id]=0; draw(); } },3600); } }
  else if(d.type==='bp') pulse(k,380);
  else if(d.type==='bps') pulse(k,1400);
  else if(d.type==='digi'){ if(!powered(lastR,k)) return toast('Le digicode n\'est pas alimenté');
    if(act(()=>{ st[k]=1; })){ toast('Code bon'); clearTimeout(timers[k]); timers[k]=setTimeout(()=>{ delete timers[k]; if(L&&dev(k)){ st[k]=0; draw(); } },3200); } }
  else if(d.type==='recv'){ if(!powered(lastR,k)) return toast('Le récepteur n\'est pas alimenté'); act(()=>{ st[k]=st[k]?0:1; }); }
  else act(()=>{ st[k]=st[k]?0:1; });
}
function tap(q){
  if(probeOn){
    if(q.t){ if(!pr[0]||pr[1]) pr=[q.t,null]; else if(q.t!==pr[0]) pr=[pr[0],q.t]; else pr=[null,null]; draw(); }
    else if(q.k) ctl(q.k);
    else if(q.w!==undefined) toast('Pose les deux pointes sur des bornes');
    return; }
  if(selW!==null&&!(q.w!==undefined&&!selT)){ selW=null; spools(); }
  if(q.t){ if(!selT){ selT=q.t; if(auto){ color=autoColor({t:q.t}); spools(); } draw(); } else if(selT===q.t){ selT=null; draw(); } else { const a=selT; selT=null; connectEP({t:a},{t:q.t}); } }
  else if(q.w!==undefined){
    if(selT){ const a=selT; selT=null; if(q.wp) connectEP({t:a},{w:q.wp.i,x:q.wp.x,y:q.wp.y}); else draw(); }
    else if(selW===q.w) selWire(null);
    else if(wires[q.w].k) toast('Ce fil fait partie du tableau : il reste en place');
    else { selWire(q.w); toast('Fil sélectionné : choisis sa couleur'); } }
  else if(q.k) ctl(q.k);
  else { selT=null; draw(); }
}
function removeDev(id){ selW=null; pr=pr.map(t=>t&&t.startsWith(id+'.')?null:t); act(()=>{ push(); wires=wires.filter(w=>!w.a.startsWith(id+'.')&&!w.b.startsWith(id+'.')); L.devs=L.devs.filter(d=>d.id!==id); prune(); delete st[id]; }); toast('Objet retiré'); }

/* ----- Doigt : toucher, tirer un fil, déplacer un objet, faire défiler le tableau ----- */
const inTrash=e=>e.clientY>$('board').getBoundingClientRect().bottom-58;
const P2c=(cx,cy)=>{ const m=svg.getScreenCTM().inverse(); return {x:cx*m.a+cy*m.c+m.e,y:cx*m.b+cy*m.d+m.f}; };
const P2=e=>P2c(e.clientX,e.clientY);
function termAt(x,y,ex,r0){ let best=null,bd=(r0||19)*ZF; for(const d of L.devs) for(const t of terms(d)){ const id=d.id+'.'+t.n; if(id===ex) continue; const dd=Math.hypot(t.x-x,t.y-y); if(dd<bd){ bd=dd; best=id; } } return best; }
function endAt(x,y,ex){ const t=termAt(x,y,ex); if(t) return {t}; const w=nearWire(x,y,13*ZF); return w?{w:w.i,x:w.x,y:w.y}:null; }
function dropPtr(){ if(!ptr) return; const q=ptr; ptr=null; rub=null; hotT=null; $('trash').hidden=true; $('trash').classList.remove('hot'); if(q.mode==='drag') persistFree(); draw(); }
svg.addEventListener('pointerdown',e=>{
  if(e.isPrimary){ pts.clear(); pinch=null; }
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{ svg.setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault();
  if(pts.size===2){ dropPtr(); const [a,b]=[...pts.values()]; cancelAnimationFrame(vAnim);
    pinch={d0:Math.max(20,Math.hypot(a.x-b.x,a.y-b.y)),x:vx,y:vy,w:vw,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2}; return; }
  if(busy||ptr||pinch||pts.size>1) return;
  const p=P2(e); let el=e.target.closest('[data-t],[data-w],[data-k]'); const dv=e.target.closest('[data-d]');
  ptr={id:e.pointerId,x:p.x,y:p.y,cx0:e.clientX,cy0:e.clientY,cx:e.clientX,cy:e.clientY,vx0:vx,vy0:vy,mode:null,t:el?el.dataset.t:undefined,w:el&&el.dataset.w!==undefined?+el.dataset.w:undefined,k:el?el.dataset.k:undefined,d:dv?dv.dataset.d:undefined};
  if(!el&&ZF>1.05){ const t=termAt(p.x,p.y,null,15); if(t){ ptr.t=t; ptr.d=t.split('.')[0]; } }
  if(ptr.d){ const d=dev(ptr.d); ptr.ox=d.x-p.x; ptr.oy=d.y-p.y; ptr.node=d.type==='node'; }
  if(ptr.w!==undefined) ptr.wp=nearWire(p.x,p.y,18*ZF);
});
function move(cx,cy,inTr){
  if(!ptr.mode){ if(Math.hypot(cx-ptr.cx0,cy-ptr.cy0)<7) return; if(selW!==null){ selW=null; spools(); }
    ptr.mode=probeOn?(ptr.d&&!ptr.t?'drag':'pan'):(ptr.t&&!ptr.node)?'rub':ptr.d?'drag':(ptr.w!==undefined&&ptr.wp)?'rub':'pan';
    if(ptr.mode!=='pan') selT=null;
    if(ptr.mode==='rub'){ if(ptr.t){ const t=tpos(ptr.t); ptr.from={t:ptr.t}; ptr.x0=t.x; ptr.y0=t.y; } else { ptr.from={w:ptr.wp.i,x:ptr.wp.x,y:ptr.wp.y}; ptr.x0=ptr.wp.x; ptr.y0=ptr.wp.y; }
      if(auto){ color=autoColor(ptr.from); spools(); } }
    if(ptr.mode==='drag'&&L.free){ $('trash').hidden=false; $('toast').hidden=true; }
    if(ptr.mode==='pan') cancelAnimationFrame(vAnim);
    if((ptr.mode==='rub'||ptr.mode==='drag')&&!edgeR) edgeR=requestAnimationFrame(edge); }
  if(ptr.mode==='pan'){ const sc=svg.getScreenCTM().a; vHome=false; vx=ptr.vx0-(cx-ptr.cx0)/sc; vy=ptr.vy0-(cy-ptr.cy0)/sc; fit(); return; }
  const p=P2c(cx,cy);
  if(ptr.mode==='drag'){ const d=dev(ptr.d), k=T[d.type], w=barW(d), tp=k.h/2+(CAPTOP[d.type]?20:10), bt=k.h/2+(k.ext||0)+(NOCAP[d.type]||CAPTOP[d.type]?10:18);
    d.x=Math.max(WR.x0+w/2+6,Math.min(WR.x1-w/2-6,p.x+ptr.ox)); d.y=Math.max(WR.y0+tp,Math.min(WR.y1-bt,p.y+ptr.oy));
    if(L.free) $('trash').classList.toggle('hot',!!inTr); }
  else if(ptr.mode==='rub'){ hotT=termAt(p.x,p.y,ptr.from.t); const nw=hotT?null:nearWire(p.x,p.y,13*ZF); rub={x0:ptr.x0,y0:ptr.y0,x:p.x,y:p.y,n:nw&&nw.i!==ptr.from.w?nw:null}; }
  else return;
  if(!raf) raf=requestAnimationFrame(()=>{ raf=0; if(L) draw(); });
}
/* Près d'un bord pendant qu'on tire un fil ou un objet : la vue suit toute seule. Un fil ne pousse la vue que vers le montage, un objet jusqu'au bord du terrain. */
function edge(){
  edgeR=0; if(!ptr||!(ptr.mode==='rub'||ptr.mode==='drag')) return;
  const b=$('board').getBoundingClientRect(), x=ptr.cx, y=ptr.cy, sp=d=>Math.min(8,d/5+2)*vw/360; let dx=0, dy=0;
  if(y<b.top+38) dy=-sp(b.top+38-y); else if(y>b.bottom-38&&!(L.free&&ptr.mode==='drag')) dy=sp(y-(b.bottom-38));
  if(x<b.left+26) dx=-sp(b.left+26-x); else if(x>b.right-26) dx=sp(x-(b.right-26));
  if(dx||dy){ const c=contentRect(), lim=ptr.mode==='rub'?{x0:c.x0-6,y0:c.y0-6,x1:c.x1+6,y1:c.y1+6}:WR, x0=vx, y0=vy;
    if(dx<0) vx=Math.min(vx,Math.max(lim.x0,vx+dx)); else if(dx>0) vx=Math.max(vx,Math.min(lim.x1-vw,vx+dx));
    if(dy<0) vy=Math.min(vy,Math.max(lim.y0,vy+dy)); else if(dy>0) vy=Math.max(vy,Math.min(lim.y1-vh,vy+dy));
    if(vx!==x0||vy!==y0){ vHome=false; cancelAnimationFrame(vAnim); fit(); if(vx!==x0||vy!==y0) move(ptr.cx,ptr.cy); } }
  edgeR=requestAnimationFrame(edge);
}
svg.addEventListener('pointermove',e=>{
  const pt=pts.get(e.pointerId); if(pt){ pt.x=e.clientX; pt.y=e.clientY; }
  if(pinch){ if(pts.size>=2){ const [a,b]=[...pts.values()]; zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinch.d0/Math.max(20,Math.hypot(a.x-b.x,a.y-b.y)),pinch); } return; }
  if(!ptr||e.pointerId!==ptr.id) return; ptr.cx=e.clientX; ptr.cy=e.clientY; move(e.clientX,e.clientY,inTrash(e)); });
function up(e,cancel){
  pts.delete(e.pointerId); if(pinch){ if(pts.size<2) pinch=null; return; }
  if(!ptr||e.pointerId!==ptr.id) return; const q=ptr, p=P2(e); ptr=null; rub=null; hotT=null; $('trash').hidden=true; $('trash').classList.remove('hot');
  if(cancel) return draw();
  if(!q.mode) return tap(q);
  if(q.mode==='rub'){ const B=endAt(p.x,p.y,q.from.t); if(B) connectEP(q.from,B); else draw(); }
  else if(q.mode==='drag'){ if(L.free&&inTrash(e)) removeDev(q.d); else { draw(); persistFree(); } }
  else if(q.mode!=='pan') draw();
}
svg.addEventListener('pointerup',e=>up(e)); svg.addEventListener('pointercancel',e=>up(e,true));

/* ----- Boutons ----- */
$('undo').onclick=()=>{ if(busy||!hist.length||wireLock()) return; selT=null; selW=null; spools(); act(()=>{ const s=JSON.parse(hist.pop()); wires=s.wires; L.devs=s.devs; }); };
$('clear').onclick=()=>{ if(busy) return;
  if(selW!==null&&wires[selW]){ if(wireLock()) return; const k=selW; selW=null; act(()=>{ push(); wires.splice(k,1); prune(); }); spools(); toast('Fil retiré. Annuler pour le remettre'); return; }
  if(!wires.some(w=>!w.k)&&!(L.free&&L.devs.length)) return; if(wireLock()) return; selT=null;
  act(()=>{ push(); wires=wires.filter(w=>w.k); if(L.free) L.devs=[]; else prune(); }); toast(L.free?'Établi vidé. Annuler pour revenir en arrière':'Fils retirés. Annuler pour revenir en arrière'); };
$('test').onclick=()=>{
  if(L.free) return bank();
  if(busy) return; if(!running){ if(winHtml) showWin(); return; }
  if(X){ if(!st.dbr) return toast('Remets l\'installation sous tension avant de valider');
    const rest=ck.filter(c=>!c).length; if(rest) return brief(false,`Avant de valider, il reste ${rest} contrôle${rest>1?'s':''} à faire sous tension.`);
    if(probeOn) setProbe(false); }
  tries++; const res=runCheck(L,wires);
  if(res.ok) return win();
  if(X){ refused=true; if(!res.fault) errs++; hud(); } else pen+=10000;
  if(res.fault){ zap(res.fault); if(lives<=0) return; }
  const e=res.errs[0], rest=res.errs.slice(1);
  sheet(`<h3 class="bad">${e.t}</h3><p>${e.x}</p>`+(res.fault?`<p>Ce défaut apparaît dans une position des commandes que tu n'avais pas encore essayée.</p>`:'')+
    (rest.length?`<p style="margin-bottom:4px">À corriger aussi :</p><ul class="more">${rest.map(x=>`<li>${x.t}</li>`).join('')}</ul>`:'')+
    (tries>=2?`<div class="rule"><b>Indice</b>${L.hint}</div>`:'')+`<p style="color:var(--mute);font-size:13px">${X?'Validation refusée : une erreur comptée. Coupe, vérifie l\'absence de tension, puis corrige.':'Essai raté : 10 secondes de pénalité.'}</p><div class="row"><button class="go" id="s-ok">Corriger</button></div>`);
  $('s-ok').onclick=()=>$('sheet').hidden=true;
};
function showWin(){ sheet(winHtml); const last=cur===MODES[mode].length-1;
  $('s-stay').onclick=()=>$('sheet').hidden=true; $('s-next').onclick=()=>last?levels(mode):open(cur+1); }
function win(){
  running=false; busy=true; const t=elapsed(), old=save[mode][cur]||{};
  const n=X?(cheated?1:errs===0?3:errs<=2?2:1):(cheated?1:(tries===1&&lives===3)?3:tries<=2?2:1), rec=!X&&!cheated&&(!old.t||t<old.t);
  if(X) save[mode][cur]={s:Math.max(old.s||0,n),e:cheated?old.e:old.e===undefined?errs:Math.min(old.e,errs)};
  else save[mode][cur]={s:Math.max(old.s||0,n),t:rec?t:old.t};
  persist();
  const ids=L.glow||L.devs.filter(d=>WORDS[d.type]).map(d=>d.id); let s2=null;
  for(const c of (L.show||[{}])){ const s=Object.assign(initState(L.devs),c), r=settle(L.devs,wires,s); if(!r.fault&&ids.every(id=>r.on[id])){ s2=s; break; } }
  clearTimers(); st=s2||Object.assign(initState(L.devs),(L.show||[{}])[0]); draw(); if(X) hud(); viewTo(allView());
  const last=cur===MODES[mode].length-1;
  winHtml=`<h3 class="ok">${L.win}</h3>`+(X?`<p class="time">${stars(n)} &nbsp; ${cap(errTxt(errs))}${cheated?' · solution affichée':''}</p>`+(n<3&&!cheated?`<p class="hintx">Rejoue le chantier sans aucune erreur pour décrocher les 3 étoiles.</p>`:''):
     `<p class="time">${stars(n)} &nbsp; ${fmt(t)}${cheated?' · solution affichée, temps non retenu':rec?(old.t?' · nouveau record !':' · premier record'):' · record '+fmt(old.t)}</p>`)+
    `<div class="rule"><b>À retenir</b>${L.rule}</div><div class="rule"><b>Le câblage</b>${L.hint}</div>`+
    `<div class="row"><button id="s-stay">Voir le montage</button><button class="go" id="s-next">${last?'Retour aux niveaux':'Niveau suivant'}</button></div>`;
  const bn=$('banner'); bn.textContent=X?'Chantier validé !':L.mode==='ac'?'Courant rétabli !':'Ça fonctionne !'; bn.hidden=false;
  clearTimeout(winT); winT=setTimeout(()=>{ bn.hidden=true; busy=false; if(L&&!$('game').hidden&&winHtml) showWin(); },2600);
}
$('help').onclick=()=>{
  const how=`<p>Touche une borne puis une autre pour tirer un fil, ou glisse le doigt de l'une à l'autre. En mode Auto, la couleur suit la borne de départ : bleu pour le neutre, vert-jaune pour la terre, rouge pour la phase et le +, noir pour le −, orange pour les retours. Touche une bobine pour choisir toi-même. Termine sur un fil existant pour y créer un nœud. Touche un fil pour le sélectionner : une bobine change alors sa couleur, et « Retirer le fil » l'enlève. Les objets se déplacent en les faisant glisser, les fils suivent. Écarte ou pince deux doigts pour zoomer, glisse le fond (ou deux doigts) pour te déplacer : le terrain est plus grand que l'écran. Le bouton en haut à droite du terrain recadre la vue.</p>`;
  const tst=`<p>Le Testeur mesure la tension entre deux bornes : touche Testeur, puis une borne pour la pointe rouge et une autre pour la pointe noire. La mesure suit en direct quand tu manœuvres les commandes.</p>`;
  if(L.free){ sheet(`<h3>Mode libre</h3>${how}${tst}<p>« + Objets » ouvre la banque. Un objet glissé tout en bas de l'établi est retiré. Un défaut (court-circuit, surcharge, surtension, LED sans résistance) annule l'action et t'explique pourquoi. Ton schéma est gardé sur cet appareil.</p><div class="row"><button class="go" id="s-ok">Fermer</button></div>`);
    $('s-ok').onclick=()=>$('sheet').hidden=true; return; }
  sheet(`<h3>Aide</h3>`+(X?`<p>Mode expert, comme sur un vrai chantier : on coupe le disjoncteur de branchement, on vérifie l'absence de tension, on câble, on remet sous tension, on fait les contrôles de la Fiche, puis on valide. </p>${tst}`:'')+how+
    `<p>Chaque défaut coûte un fusible : au troisième, il faut recommencer.${X?' Pas de chrono : les étoiles dépendent du nombre d\'erreurs.':''}</p><div class="rule"><b>Indice</b>${L.hint}</div><div class="row"><button id="s-sol">Montrer la solution</button><button class="go" id="s-ok">Fermer</button></div>`);
  $('s-ok').onclick=()=>$('sheet').hidden=true;
  $('s-sol').onclick=()=>{ if(busy) return; push(); const LV=MODES[mode][cur]; L.devs=LV.devs.map(d=>Object.assign({},d));
    wires=(L.pre||[]).filter(p=>p[3]).map(([a,b,c])=>({a,b,c,k:1})).concat(L.sol.map(([a,b,c])=>({a,b,c}))); cheated=true; selT=null; selW=null; clearTimers(); st=initState(L.devs);
    if(X){ probeOn=false; pr=[null,null]; $('probe').classList.remove('on'); $('board').classList.remove('probing'); ck=ck.map(()=>true); vat=false; cutOnce=true; refused=false; }
    spools(); $('sheet').hidden=true; draw(); hud(); toast(X?'Solution posée et sous tension : 1 étoile':'Solution posée : 1 étoile, pas de record'); };
};
/* ----- Banque du mode libre ----- */
function bank(){
  const o0={on:{},lv:{},dir:{},flag:{},cur:{},pw:{},free:false};
  sheet(`<h3>Banque d'objets</h3>`+BANK.map(([g,items],gi)=>`<h4>${g}</h4><div class="bank">`+items.map(([t,n,p],i)=>{ const k=T[t], d=Object.assign({id:'_',type:t,x:0,y:0},p||{},{label:''}), w=barW(d)+26, top=k.h/2+(t==='recv'?36:13), h=top+k.h/2+(k.ext||0)+13;
    return `<button data-b="${gi}|${i}"><svg viewBox="${-w/2} ${-top} ${w} ${h}">${devSvg(d,Object.assign({st:k.init?{_:1}:{}},o0))+termsSvg([d])}</svg><span>${n}</span></button>`; }).join('')+`</div>`).join('')+
    `<div class="row"><button class="go" id="s-ok">Fermer</button></div>`);
  $('s-ok').onclick=()=>$('sheet').hidden=true;
  $('sheetin').querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{ const [gi,i]=b.dataset.b.split('|'), [t,n,p]=BANK[gi][1][i]; addDev(t,n,p); $('sheet').hidden=true; });
}
function addDev(t,n,p){
  const cx=vx+vw/2, cy=vy+vh/2-10, spots=[]; for(const dy of [0,-95,95,-190,190]) for(const dx of [0,-105,105]) spots.push([Math.max(WR.x0+70,Math.min(WR.x1-70,cx+dx)),Math.max(WR.y0+70,Math.min(WR.y1-130,cy+dy))]);
  const free=spots.find(([x,y])=>!L.devs.some(d=>Math.abs(d.x-x)<80&&Math.abs(d.y-y)<74))||[cx-80+Math.random()*160,cy-90+Math.random()*180];
  const d=Object.assign({id:t+(++idn),type:t,x:free[0],y:free[1],label:n},p||{}); if(!d.label) d.label=n;
  push(); L.devs.push(d); if(T[t].init) st[d.id]=1; draw(); persistFree(); toast(n+' ajouté. Fais-le glisser où tu veux');
}
home();
}
