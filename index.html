<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AZEREM</title>
<meta name="description" content="Prise de notes chez le client pour préparer les devis.">
<meta name="theme-color" content="#2b2c31">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AZEREM">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --text:#17202a; --muted:#5d6b7a; --line:#dde3ea;
  --primary:#1f4e79; --primary-soft:#e3edf7; --accent:#e8a317; --danger:#c0392b;
  --enc:#1f4e79; --gou:#b9770e; --gou-soft:#fdf2df; --head:#1f4e79; --on-primary:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --card:#1b232c; --text:#e8edf2; --muted:#9aa8b6; --line:#2c3743;
    --primary:#5aa2e0; --primary-soft:#1d3245; --accent:#f0b43a; --danger:#e5604f;
    --enc:#5aa2e0; --gou:#f0b43a; --gou-soft:#3a2f1a; --head:#16324d; --on-primary:#0b1724;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --card:#1b232c; --text:#e8edf2; --muted:#9aa8b6; --line:#2c3743;
  --primary:#5aa2e0; --primary-soft:#1d3245; --accent:#f0b43a; --danger:#e5604f;
  --enc:#5aa2e0; --gou:#f0b43a; --gou-soft:#3a2f1a; --head:#16324d; --on-primary:#0b1724;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:clip;background:var(--bg);color:var(--text);
  font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
header.top{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;
  padding:calc(6px + env(safe-area-inset-top)) 12px 6px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top button{color:#fff;min-width:38px;height:38px;border-radius:8px;font-size:20px}
header.top button:active{background:rgba(255,255,255,.18)}
header.top .hclient{flex:1;min-width:0;text-align:left;height:auto;font-size:inherit;padding:2px 4px;display:block}
header.top .hclient b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .hclient .htype{font-weight:500;font-size:14px;opacity:.9}
header.top .hclient small{display:block;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-meta{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 8px;font-size:14px;color:var(--muted)}
.room-meta label{display:flex;align-items:center;gap:6px}
.room-meta input{width:72px;min-height:32px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:16px;color:var(--text)}
main{padding:12px 14px;max-width:720px;margin:0 auto}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 14px;
  border-radius:10px;font-weight:600;background:var(--primary);color:var(--on-primary);width:100%}
.btn.sec{background:var(--primary-soft);color:var(--primary)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:active{opacity:.8}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:left;min-height:76px}
.type{display:flex;align-items:center;gap:12px;min-height:0}
.type .ico{font-size:22px}
.type b{display:block;font-size:15px}
.type small{font-size:12px}
.type small{color:var(--muted)}
.type.on{border-color:var(--primary);background:var(--primary-soft)}
.type[disabled]{opacity:.5}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--accent);color:#000;margin-left:4px;vertical-align:middle}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input.t,textarea.t{width:100%;min-height:40px;padding:8px 10px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea.t{min-height:64px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:0}
.devis-item{display:flex;align-items:center;gap:6px;text-align:left;width:100%;padding:0}
.devis-item .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:12px}
.devis-item .icon-btn{margin-right:6px;font-size:22px}
.home-h h2{display:flex;align-items:center;gap:8px;margin-top:6px}
.cnt{background:var(--primary-soft);color:var(--primary);border-radius:99px;padding:1px 8px;font-size:12px;letter-spacing:0}
.note{position:relative;display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;
  box-shadow:inset 4px 0 0 var(--bar, var(--primary))}
.note[data-type="reno-complete"]{--bar:#2e8b57}
.note[data-type="intervention"]{--bar:var(--accent)}
.note[data-type="acces"]{--bar:#ffb020}
.note[data-type="vrd"]{--bar:#c47a3a}
.note-open{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 6px 12px 16px}
.note-open:active{background:var(--bg)}
.note-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip-type{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quand{font-size:12px;color:var(--muted);white-space:nowrap}
.note-client{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.note-adr{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-stats{font-size:13px;color:var(--primary);font-weight:600;margin-top:4px}
.note-menu{flex:none;width:44px;font-size:22px;color:var(--muted);border-left:1px solid var(--line)}
.note-menu:active{background:var(--bg)}
.vide{text-align:center;padding:48px 20px;color:var(--muted)}
.vide-ico{font-size:44px;margin-bottom:8px}
.vide b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.vide p{margin:0 auto;max-width:300px;font-size:14px}
.sync{display:block;width:100%;text-align:center;font-size:12px;color:var(--muted);margin:16px 0 0;padding:8px}
.menu{display:flex;flex-direction:column;margin-bottom:12px}
.menu button{text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);font-size:15px}
.menu .rouge{color:var(--danger)}
.devis-item .ico{font-size:26px}
.devis-item .m{flex:1;min-width:0}
.devis-item .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.devis-item small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
/* onglets pièces */
.tabs{position:sticky;top:calc(50px + env(safe-area-inset-top));z-index:4;background:var(--bg);
  display:flex;gap:8px;overflow-x:auto;padding:8px 14px;margin:0 -14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:34px;padding:0 12px;font-size:14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;white-space:nowrap}
.tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
.tab .n{font-size:12px;opacity:.8;margin-left:4px}
.tab.add{color:var(--primary);border-style:dashed}
.rooms-top{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.rooms-top .sp{flex:1}
.room{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden}
.room-bar{display:flex;align-items:center;gap:8px;width:100%;min-height:46px;padding:0 12px;text-align:left;background:transparent;color:var(--text);font-size:16px}
.room:not(.replie) .room-bar{border-bottom:1px solid var(--line);background:var(--primary-soft)}
.rb-ico{width:14px;color:var(--primary);font-size:14px}
.rb-txt{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.rb-txt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-info{font-size:13px;color:var(--muted);white-space:nowrap;margin-left:auto}
.room-bar{padding-right:4px}
.rb-tog{display:flex;align-items:center;gap:8px;flex:1;min-width:0;align-self:stretch;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left}
.rb-meta{font-size:13px;color:var(--accent);white-space:nowrap}
.rb-surf{flex:none;display:flex;align-items:center;gap:3px;font-size:13px;color:var(--accent)}
.rb-surf input{width:52px;height:30px;padding:2px 6px;border:1px solid rgba(70,220,246,.45);border-radius:8px;background:rgba(20,20,24,.55);color:var(--text);font-size:16px;text-align:right}
.rb-set{flex:none;width:36px;height:32px;border-radius:9px;border:1px solid var(--line);background:rgba(20,20,24,.35);color:var(--accent);font-size:17px;display:flex;align-items:center;justify-content:center}
.danger-t{color:var(--danger)!important}
.room-body{padding:4px 12px 12px}
.room-body .room-head input{font-size:15px;font-weight:600;color:var(--muted)}
.tabs:has(.roomsel){overflow:visible;align-items:flex-start}
.roomsel{flex:1;min-width:0;position:relative}
.roomsel summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border-radius:12px;
  background:var(--primary);color:var(--on-primary,#fff);font-weight:700;cursor:pointer}
.roomsel summary::-webkit-details-marker{display:none}
.roomsel summary::after{content:"▾";margin-left:auto;font-size:14px}
.roomsel[open] summary::after{content:"▴"}
.rs-cur{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs-cur .n,.rs-item .n{font-size:12px;font-weight:600;opacity:.8;margin-left:6px}
.rs-nb{font-size:12px;font-weight:500;opacity:.8;white-space:nowrap}
.rs-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:60vh;overflow:auto;z-index:8;padding:4px}
.rs-item{display:flex;align-items:center;width:100%;min-height:40px;padding:0 10px;border-radius:8px;text-align:left;font-size:15px;font-weight:600;color:var(--text);background:transparent}
.rs-item.on{background:var(--primary-soft);color:var(--primary)}
.room-head{display:flex;align-items:center;gap:6px;margin:6px 0}
.room-head input{flex:1;font-size:18px;font-weight:700;border:0;background:transparent;padding:6px 0;min-width:0}
.icon-btn{min-width:36px;height:36px;border-radius:8px;font-size:17px;color:var(--muted)}
.icon-btn:active{background:var(--line)}
/* lignes */
.ligne{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:6px}
.ligne.has{border-color:var(--primary);box-shadow:inset 4px 0 0 var(--primary)}
.l1{display:flex;align-items:center;gap:8px}
.l1 .lib{flex:1;min-width:0;font-weight:500}
.l1 .lib input{width:100%;border:0;border-bottom:1px dashed var(--line);background:transparent;padding:4px 0;min-height:32px;font-size:16px}
.step{display:flex;align-items:center;flex:none}
.step button{width:32px;height:32px;border-radius:8px;font-size:20px;line-height:1;font-weight:700;background:var(--primary-soft);color:var(--primary)}
.step button:active{transform:scale(.94)}
.step input{width:42px;text-align:center;font-size:16px;font-weight:700;border:0;background:transparent;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.l2{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px}
.pose{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.pose button{padding:3px 10px;min-height:26px;font-size:12px;font-weight:600;color:var(--muted)}
.pose button.on.e{background:var(--enc);color:#fff}
.pose button.on.g{background:var(--gou);color:#fff}
.l2 .sp{flex:1}
.unite{font-size:12px;color:var(--muted);margin-left:4px;min-width:22px}
.lot{font-size:12px;color:var(--muted)}
.l2 .del{color:var(--danger);font-size:16px;min-height:26px;padding:0 6px}
.l2 .nbtn{color:var(--muted);font-size:12px;min-height:26px;padding:0 8px;border:1px solid var(--line);border-radius:99px}
.l2 .nbtn.on{color:var(--primary);border-color:var(--primary)}
.lnote{margin-top:6px}
.lnote textarea{width:100%;min-height:52px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px;resize:vertical}
.lnote-r{font-size:13px;color:var(--muted);margin-top:2px}
.room-tools{display:flex;gap:6px;margin:4px 0 10px;flex-wrap:wrap}
.chip{min-height:30px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px}
.chip:active{background:var(--line)}
.only{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-left:auto}
.only input{width:20px;height:20px}
/* plan des pièces */
.plan-hint{font-size:13px;color:var(--muted);margin:0 0 8px}
.plan-wrap{height:56vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);-webkit-overflow-scrolling:touch;position:relative}
.plan-grid{position:relative;background-color:var(--card);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px)}
.proom{position:absolute;box-sizing:border-box;border:2px solid var(--primary);background:color-mix(in srgb,var(--primary-soft) 85%,transparent);
  border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;padding:2px;color:var(--text)}
.proom b{font-size:12px;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.proom small{font-size:11px;color:var(--muted)}
.proom.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent);z-index:2}
.proom.nosurf{border-style:dashed}
.plan-tray{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;align-items:center}
.plan-tray .lbl{font-size:13px;color:var(--muted);margin-right:2px}
.plan-panel{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.plan-panel h3{margin:0 0 6px;font-size:16px}
.plan-panel .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.plan-panel label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.plan-panel input{width:70px;min-height:34px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px;color:var(--text)}
.zoom{display:flex;gap:4px}
.plan-svg{display:block;width:100%;height:auto;max-height:70vh;background:var(--card)}
.plan-svg .g line{stroke:var(--line)}
.plan-svg .r{fill:var(--primary-soft);stroke:var(--primary)}
.plan-svg .r.ns{stroke-dasharray:.2 .15}
.plan-svg text{fill:var(--text)} .plan-svg text.s{fill:var(--muted)}
.zoom button{width:36px;height:36px;font-size:20px}
/* barre du bas */
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:6}
.bottom .btn{flex:1;min-width:0;white-space:nowrap;padding:0 10px}
/* feuille modale */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 12px}
.grid-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-bottom:12px}
.grid-chips button{min-height:40px;border-radius:10px;font-size:14px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1}
/* récap */
.recap table{width:100%;border-collapse:collapse;font-size:15px}
.recap td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.recap td.q{text-align:right;font-weight:700;white-space:nowrap;width:64px}
.recap td.p{width:86px;text-align:right}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.e{background:var(--primary-soft);color:var(--enc)}
.tag.g{background:var(--gou-soft);color:var(--gou)}
.recap h4{margin:4px 0 6px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;z-index:30;font-size:14px}
.muted{color:var(--muted)}
/* sélecteur de prestations */
.pick-h{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 4px}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 4px;border-bottom:1px solid var(--line);font-size:15px}
.pick .ck{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.pick.sel .ck{background:var(--primary);border-color:var(--primary)}
.pick[disabled]{opacity:.45}
.pick small{margin-left:auto;color:var(--muted);font-size:12px}
.sheet-foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));z-index:1;background:var(--card);padding:10px 0 calc(18px + env(safe-area-inset-bottom));margin-top:8px}
.cat{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--card)}
.cat summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;font-weight:600;font-size:15px;cursor:pointer}
.cat summary::-webkit-details-marker{display:none}
.cat summary::after{content:"›";font-size:20px;color:var(--muted);transform:rotate(90deg);transition:transform .15s}
.cat[open] summary::after{transform:rotate(-90deg)}
.cat summary span:first-child{flex:1}
.cat-n{font-size:12px;color:var(--primary);font-weight:700}
.cat[open] summary{border-bottom:1px solid var(--line);background:var(--primary-soft)}
.cat-body{padding:0 12px 6px}
.add-presta{border:1px dashed var(--primary);background:transparent}
/* ===== Thème « Azerem » : rétro moderne (néon, chrome bleu-cyan, violet, lueur rose) ===== */
:root, :root[data-theme="dark"], :root[data-theme="light"]{
  --bg:#2b2c31; --card:#36373e; --text:#f3f3f7; --muted:#b4b4c2; --line:#4b4c56;
  --primary:#e04cf5; --primary-soft:#3d3a52; --accent:#46dcf6; --danger:#ff5c7a;
  --enc:#ff2a6d; --gou:#46dcf6; --gou-soft:#1f3a4a; --head:#1a237e; --on-primary:#fff;
  --chrome: linear-gradient(90deg,#1a237e 0%,#4a2bb0 40%,#2fa6e0 78%,#47e3f5 100%);
  --chrome-v: linear-gradient(180deg,#7fb6ff 0%,#3a5fd8 48%,#2fb5e8 52%,#6ff0ff 100%);
  --glow: 0 0 0 1px rgba(70,220,246,.55), 0 0 14px rgba(70,220,246,.35);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#2b2c31; --card:#36373e; --text:#f3f3f7; --muted:#b4b4c2; --line:#4b4c56;
  --primary:#e04cf5; --primary-soft:#3d3a52; --accent:#46dcf6; --danger:#ff5c7a;
  --enc:#ff2a6d; --gou:#46dcf6; --gou-soft:#1f3a4a; --head:#1a237e; --on-primary:#fff; } }
html,body{background:var(--bg);color:var(--text)}
/* fond : dégradé + grille rétro en perspective, très discrète */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(120% 50% at 50% 0%, rgba(74,43,176,.22), transparent 60%),
    radial-gradient(90% 40% at 50% 110%, rgba(70,220,246,.12), transparent 65%),
    var(--bg)}
body::after{content:"";position:fixed;left:-50%;right:-50%;bottom:0;height:38vh;z-index:-1;pointer-events:none;opacity:.14;
  background-image:linear-gradient(rgba(224,76,245,.9) 1px,transparent 1px),linear-gradient(90deg,rgba(224,76,245,.9) 1px,transparent 1px);
  background-size:44px 44px;transform:perspective(320px) rotateX(62deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent)}
/* barre du haut chromée */
header.top{background:var(--chrome);box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 4px 18px rgba(70,220,246,.35);text-shadow:0 1px 2px rgba(10,6,50,.6)}
header.top h1{font-weight:800;font-style:italic;letter-spacing:.02em}
header.top .hclient b{font-weight:800;font-style:italic}
header.top button:active{background:rgba(255,255,255,.18)}
h2{color:var(--primary);font-style:italic;font-weight:800;letter-spacing:.08em;text-shadow:0 0 10px rgba(224,76,245,.35)}
/* cartes en verre sombre */
.card,.note,.room,.ligne,.cat,.plan-panel,.type,.sync,.sheet{background:rgba(54,55,62,.94);border-color:var(--line);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.note{box-shadow:inset 4px 0 0 var(--bar,#e04cf5)}
.note[data-type="reno-elec"]{--bar:#e04cf5}
.note[data-type="reno-complete"]{--bar:#7b5cff}
.note[data-type="intervention"]{--bar:#46dcf6}
.note:active,.note-open:active{background:#3d3a52}
.ligne.has{border-color:rgba(224,76,245,.6);box-shadow:inset 4px 0 0 var(--primary), 0 0 12px rgba(224,76,245,.12)}
.type.on{border-color:var(--accent);box-shadow:var(--glow);background:#3d3a52}
/* boutons */
.btn{border-radius:12px}
.btn:not(.sec):not(.danger){background:linear-gradient(100deg,#4a2bb0,#b03ee0 70%,#f06cf5);color:#fff;font-weight:800;
  text-shadow:0 1px 2px rgba(10,6,50,.5);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset, 0 4px 16px rgba(224,76,245,.28)}
.btn.sec{background:rgba(224,76,245,.08);color:var(--primary);box-shadow:inset 0 0 0 1px rgba(224,76,245,.45)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.chip,.tab,.l2 .nbtn{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--text)}
.tab.add{color:var(--primary);border-color:rgba(224,76,245,.55)}
.step button{background:rgba(224,76,245,.12);color:var(--primary)}
.pose{border-color:var(--line)}
.pose button.on.e{background:var(--enc);color:#fff}
.pose button.on.g{background:var(--gou);color:#0b0630}
.tag.e{background:rgba(255,42,109,.16);color:var(--enc)}
.tag.g{background:rgba(70,220,246,.14);color:var(--gou)}
/* champs */
input.t,textarea.t,.room-meta input,.step input,.l1 .lib input,.lnote textarea,.plan-panel input,.room-head input{background:rgba(20,20,24,.55);color:var(--text);border-color:var(--line)}
input:focus,textarea:focus{outline:none;border-color:var(--primary) !important;box-shadow:0 0 0 2px rgba(224,76,245,.25)}
/* pièces */
.room-bar{color:var(--text)}
.room:not(.replie){border-color:rgba(224,76,245,.45)}
.room:not(.replie) .room-bar{background:linear-gradient(90deg,rgba(74,43,176,.55),rgba(224,76,245,.3));border-bottom-color:var(--line)}
.rb-ico{color:var(--primary)}
/* listes à cocher */
.pick .ck{border-color:#5a4aa8}
.pick.sel .ck{background:linear-gradient(135deg,#b03ee0,#f06cf5);border-color:#f06cf5;color:#fff}
.pick.sel{background:rgba(224,76,245,.07)}
.cat[open]{border-color:rgba(224,76,245,.45)}
.cat[open] summary{background:linear-gradient(90deg,rgba(74,43,176,.6),rgba(224,76,245,.3))}
.cat-n{color:var(--primary)}
/* feuilles */
.sheet-bg{background:rgba(5,2,20,.6)}
.sheet{background:#303137;border-top:1px solid rgba(70,220,246,.5);box-shadow:0 -6px 30px rgba(70,220,246,.25)}
.sheet h3{font-style:italic;font-weight:800}
.sheet-foot{background:#303137}
/* barre du bas */
.bottom{background:rgba(38,39,44,.95);border-top-color:rgba(70,220,246,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
/* divers */
.toast{background:#3d3a52;color:#fff;box-shadow:var(--glow)}
.badge{background:var(--accent);color:#fff}
.roomsel summary{background:var(--chrome)}
.plan-wrap{background:#222327;border-color:var(--line)}
.plan-grid{background-color:#222327;background-image:linear-gradient(rgba(224,76,245,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(224,76,245,.14) 1px,transparent 1px)}
.proom{background:rgba(74,43,176,.55);border-color:#e04cf5;color:#fff}
.proom small{color:#f6dcff}
.proom.sel{border-color:#46dcf6;box-shadow:0 0 0 3px rgba(70,220,246,.4), 0 0 16px rgba(70,220,246,.5)}
.plan-svg{background:#222327}
.plan-svg .g line{stroke:rgba(224,76,245,.14)}
.plan-svg .r{fill:rgba(74,43,176,.55);stroke:#e04cf5}
.plan-svg text{fill:#fff} .plan-svg text.s{fill:#cfe9ff}
/* boutons plus compacts */
.btn{min-height:36px;font-size:14px;padding:0 12px;border-radius:10px}
.bottom{padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}

header.top button{min-width:34px;height:34px;font-size:18px}
/* en-tête d'accueil avec le logo */
.hero{position:sticky;top:0;z-index:5;overflow:hidden;display:flex;flex-direction:row-reverse;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(6px + env(safe-area-inset-top)) 14px 6px;min-height:50px;

.hero::after{content:"";position:absolute;left:-40%;right:-40%;bottom:-2px;height:70%;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(70,220,246,.8) 1px,transparent 1px),linear-gradient(90deg,rgba(70,220,246,.8) 1px,transparent 1px);
  background-size:36px 36px;transform:perspective(220px) rotateX(60deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent)}
.hero-logo{position:relative;z-index:1;display:block;height:34px;width:auto;filter:drop-shadow(0 0 6px rgba(224,76,245,.45))}
.hero-txt{position:relative;z-index:1;text-align:left;min-width:0}
.hero-sub{font-weight:800;font-style:italic;letter-spacing:.18em;text-transform:uppercase;font-size:11px;white-space:nowrap;color:#fff;text-shadow:0 0 8px rgba(70,220,246,.7)}

h2.titre-notes{color:#fff;font-size:19px;font-weight:600;letter-spacing:.04em;text-shadow:0 0 12px rgba(224,76,245,.45);display:flex;align-items:center;gap:10px;margin-top:8px}
h2.titre-notes .cnt{font-size:14px}
/* boutons et en-têtes : finitions */
.btn.sec.btn-plan{background:rgba(255,206,48,.16);color:#ffd84a;box-shadow:inset 0 0 0 1px rgba(255,206,48,.55)}
header.top{overflow:hidden;background:radial-gradient(80% 140% at 50% 0%, rgba(224,76,245,.35), transparent 70%), linear-gradient(180deg,#1a1440,#2b2c31);
  border-bottom:1px solid rgba(224,76,245,.45);box-shadow:0 6px 24px rgba(224,76,245,.18);text-shadow:none}
header.top::after{content:"";position:absolute;left:-40%;right:-40%;bottom:-2px;height:70%;pointer-events:none;opacity:.35;z-index:0;
  background-image:linear-gradient(rgba(70,220,246,.8) 1px,transparent 1px),linear-gradient(90deg,rgba(70,220,246,.8) 1px,transparent 1px);
  background-size:36px 36px;transform:perspective(220px) rotateX(60deg);transform-origin:bottom;
  -webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent)}
header.top > *{position:relative;z-index:1}

.pose button.on.p{background:#ffb03a;color:#2a1600}
.tag.p{background:rgba(255,176,58,.16);color:#ffb03a}
.pose button{padding:2px 8px}
.vide-l{font-size:12px;color:var(--muted);font-style:italic;padding:2px 2px 6px}

.l2 .nbtn.on{background:rgba(224,76,245,.12);color:var(--text)}
/* ===== Hiérarchie typographique (tailles de texte seulement, encarts inchangés) ===== */

.log-m2{font-size:14px;margin:2px 0 10px;color:var(--text)}.log-m2 b{color:var(--accent)}.log-m2 small{color:var(--muted);font-size:12px}

/* Triangles des menus plus grands (doigt) */

/* Bouton pour fermer le clavier (iPhone) */

  border:1px solid rgba(70,220,246,.6);background:rgba(30,26,60,.96);color:#fff;font-size:15px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.45)}

/* Tableau électrique */
.tb-rg{background:rgba(54,55,62,.94);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px}
.tb-rg-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}.tb-rg-h b{font-size:16px}.tb-rg-h span{font-size:12.5px;color:var(--muted)}
.tb-rg-h .tb-trop{color:var(--danger)}.tb-x{width:32px;height:30px;border-radius:8px;font-size:15px;color:var(--muted)}
.tb-rail{padding:6px 4px;border-radius:8px;background:linear-gradient(180deg,#d9dbe1,#b9bcc6);min-height:124px;box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
.tb-mod{min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 1px;border-radius:4px;border:1px solid rgba(0,0,0,.25);
  background:linear-gradient(180deg,#fbfbfd,#e9eaf0);color:#1d1a2b;overflow:hidden;box-shadow:inset 0 3px 0 hsl(var(--h),70%,72%)}
.tb-mod.vide{background:repeating-linear-gradient(135deg,#d5d7de,#d5d7de 4px,#c6c8d0 4px,#c6c8d0 8px);box-shadow:none}
.tb-c{font-size:10px;font-weight:800;line-height:1.1;white-space:nowrap;margin-top:3px}.tb-s{font-size:8px;font-weight:700;color:hsl(var(--h),55%,35%);line-height:1}
.tb-man{width:9px;height:16px;border-radius:2px;background:#2b2c31;flex:none;margin:2px 0}.tb-mod.vide .tb-man{display:none}
.tb-n{flex:1;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:600;line-height:1.05;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-height:64px;color:#3a3550}
.tb-libre{min-width:0;border:1.5px dashed rgba(60,60,80,.55);border-radius:4px;color:#4a4b5a;font-size:20px;background:rgba(255,255,255,.25)}
.tb-nom{display:flex;align-items:center;gap:6px;padding:2px 4px 2px 8px;border-radius:8px;background:hsla(var(--h),70%,80%,.09);border:1px solid hsla(var(--h),60%,80%,.28);box-shadow:inset 3px 0 0 hsl(var(--h),65%,80%)}
.tb-num{width:34px;font-size:12px;color:var(--muted);text-align:right;flex:none}.tb-ty{width:74px;flex:none;font-size:12.5px;font-weight:700;color:hsl(var(--h),70%,88%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-nom input{flex:1;min-width:0;height:32px;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--text);font-size:16px;padding:0 2px}
.tb-add{width:100%;margin-top:8px}.tb-add:disabled,.bottom .btn:disabled{opacity:.45}
.tb-bas{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.tb-reste{font-size:13px;color:var(--accent);margin:-4px 0 4px}
.tb-choix{display:flex;flex-direction:column;gap:4px}
.tb-ch{display:flex;align-items:center;gap:8px;text-align:left;padding:9px 10px;border-radius:9px;background:hsla(var(--h),70%,80%,.09);border:1px solid hsla(var(--h),60%,80%,.28);box-shadow:inset 3px 0 0 hsl(var(--h),65%,80%);color:var(--text)}
.tb-ch b{flex:1;font-size:14.5px;font-weight:600}.tb-ch small{color:var(--muted);font-size:12px;white-space:nowrap}.tb-ch:disabled{opacity:.35}
.tuile.t-tab{grid-column:1 / -1;flex-direction:row;align-items:center;gap:12px;min-height:0;padding:14px;background:linear-gradient(160deg,rgba(255,176,58,.22),rgba(224,76,245,.10));border-color:rgba(255,176,58,.5)}
.tuile.t-tab .ti{margin:0}.tuile.t-tab .tt{display:flex;flex-direction:column;gap:2px}

.tb-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px}
.tb-nums{display:grid;padding:0 4px;margin-bottom:2px}.tb-nums span{grid-column:span 2;text-align:center;font-size:10.5px;font-weight:700;color:var(--accent);line-height:1.4}
.tb-rail{display:grid;gap:0;align-items:stretch}
.tb-mod{margin:0 1px;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:box-shadow .1s}
.tb-mod.drag{z-index:5;position:relative;opacity:.92;box-shadow:0 6px 18px rgba(0,0,0,.5), inset 0 3px 0 hsl(var(--h),70%,72%)}
.tb-mod.ici{box-shadow:-4px 0 0 var(--primary), inset 0 3px 0 hsl(var(--h),70%,72%)}
.tb-rail.fin .tb-mod:not(.drag):last-of-type{box-shadow:4px 0 0 var(--primary), inset 0 3px 0 hsl(var(--h),70%,72%)}
.tb-libre{margin:0 1px}
.tb-larg{display:flex;gap:8px;flex-wrap:wrap}.tb-larg .chip{padding:8px 14px;font-size:14px}.tb-larg .chip.on{border-color:var(--primary);background:rgba(224,76,245,.2)}.tb-larg .chip:disabled{opacity:.35}
div.tb-ch{padding:0;gap:0;margin-bottom:4px}
.tb-ck{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;padding:9px 6px 9px 10px;color:var(--text);background:none;border:0}
.tb-ck .ck{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid hsla(var(--h),60%,80%,.6);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#1d1a2b}
.tb-ch.sel .ck{background:hsl(var(--h),65%,82%);border-color:hsl(var(--h),65%,82%)}
.tb-ch.plein{opacity:.4}
.tb-q{display:flex;align-items:center;gap:2px;padding-right:6px;visibility:hidden}.tb-ch.sel .tb-q{visibility:visible}
.tb-q button{width:30px;height:30px;border-radius:8px;font-size:18px;font-weight:700;background:rgba(224,76,245,.14);color:var(--primary)}
.tb-q i{min-width:20px;text-align:center;font-style:normal;font-weight:800}
select.t{appearance:none;-webkit-appearance:none;width:100%;font-size:16px;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(20,20,24,.55);color:var(--text)}

/* Tableau électrique — visuel v3 */
.tb-rg{padding:10px 10px 12px;background:linear-gradient(180deg,rgba(62,63,72,.96),rgba(46,47,54,.96))}

.tb-man{width:12px;height:22px;border-radius:3px;background:#3a3c46;margin:6px 0 3px;display:flex;justify-content:center;padding-top:2px;box-shadow:inset 0 -3px 4px rgba(0,0,0,.45)}

.tb-ico{font-size:13px;line-height:1;min-height:14px}.tb-mod.large .tb-ico{font-size:16px}

.tb-libre{border-radius:5px;background:rgba(255,255,255,.3)}
.tb-mod.ici{box-shadow:-4px 0 0 var(--primary), 0 2px 3px rgba(0,0,0,.28)}

/* Fiche en pop-up : centrée, fond transparent */
.sheet-bg.pop{align-items:center;justify-content:center;padding:16px;background:rgba(10,8,24,.18);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet-bg.pop .sheet{max-width:360px;border-radius:20px;padding:14px 14px 16px;max-height:86vh;background:rgba(44,45,54,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(224,76,245,.5);box-shadow:0 18px 50px rgba(0,0,0,.6)}

.tb-pop-h div{flex:1;min-width:0}.tb-pop-h b{display:block;font-size:15px}.tb-pop-h small{color:var(--muted);font-size:12px}

.tb-menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}

.tb-coffret .tb-rg-h{margin-bottom:4px;padding:0 2px}.tb-coffret .tb-rg-h span{color:#5d6070}
.tb-coffret .tb-rn{color:#1d1a2b;border-bottom-color:#a9adba}.tb-coffret .tb-rn::placeholder{color:#8a8d9b}
.tb-coffret .tb-nums span{color:#3d57b8}.tb-coffret .tb-x{color:#6b6e7d}
.tb-coffret .tb-add{flex:none;width:auto;margin:0;height:34px;padding:0 12px;border-radius:99px;background:var(--primary);border:0;color:#fff;font-size:14px;font-weight:800;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.tb-coffret .tb-add:disabled{opacity:.35}.tb-coffret .tb-rg-h{gap:6px}.tb-coffret .tb-rg-h span{white-space:nowrap}.tb-coffret .tb-x{width:28px}
.tb-rail{position:relative;padding:5px 3px 6px;border-radius:6px;border:2px solid #868a98;background:linear-gradient(180deg,#23252d 0,#23252d 40%,#7f8390 40%,#d3d6de 43%,#9da1ad 50%,#6d717e 52%,#23252d 52%,#23252d 100%);box-shadow:inset 0 3px 10px rgba(0,0,0,.7)}
.tb-rail>*{grid-row:1}
.tb-libre{border:1px solid #c2c5d0;border-radius:3px;background:linear-gradient(180deg,#eef0f4,#d9dce4);color:#a2a5b3;font-size:14px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.tb-mod{z-index:1}.tb-mod::after{content:"";flex:none;width:7px;height:7px;border-radius:50%;margin-top:3px;background:radial-gradient(circle at 40% 40%,#8a8d99,#2b2d35 70%)}

.tb-cible.occ{border-color:#ff9f43;background:rgba(255,159,67,.3)}
.tb-mod.drag{z-index:6}
.tb-ap{position:fixed;inset:0;z-index:45;background:#15161b;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.tb-ap-h{display:flex;align-items:center;gap:10px;padding:10px 12px}.tb-ap-h div{flex:1;min-width:0}.tb-ap-h b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tb-ap-h small{color:var(--muted);font-size:12px}

.tb-coffret.ap.n18 .tb-s,.tb-coffret.ap.n24 .tb-s{font-size:6px}

.tb-coffret.ap.n18 .tb-man,.tb-coffret.ap.n24 .tb-man{width:8px;height:14px;margin:3px 0 2px}.tb-coffret.ap.n18 .tb-man i,.tb-coffret.ap.n24 .tb-man i{width:5px;height:5px}

.tb-ap-ph{display:block;width:100%;border-radius:12px;border:1px solid var(--line)}
.tb-photo{background:rgba(54,55,62,.94);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}

.tb-scan-note div{flex:1}.tb-scan-note b{display:block;font-size:14px;margin-bottom:2px}.tb-scan-note i{display:block;margin-top:6px;color:var(--muted)}

.tb-coffret button.tb-rn{flex:0 1 auto;display:flex;align-items:center;gap:6px;border:0;text-align:left;overflow:hidden;padding:0 2px}.tb-coffret .tb-rg-h .tb-add{margin-left:4px}.tb-coffret .tb-rg-h .tb-add+span{margin-left:auto}

/* Synchronisation avec le compte Claude (quand l'appli est ouverte depuis le lien claude.ai).
   Chaque devis = un document privé « data/users/<id>/<devisId> » : visible de vous seul. */
const cloud = {ref:null, ok:false, dirty:new Set(), timers:{}, chain:{}, diag:{}};
function lsOk(){ try{ localStorage.setItem(KEY+"-t","1"); return localStorage.getItem(KEY+"-t")==="1"; }catch(e){ return false; } }
function cloudSave(id){
  if(!cloud.ref) return;
  cloud.dirty.add(id);
  clearTimeout(cloud.timers[id]);
  cloud.timers[id] = setTimeout(() => {
    const d = db.devis.find(x => x.id === id) || tabs.find(x => x.id === id) || listes.find(x => x.id === id);
    const prev = cloud.chain[id] || Promise.resolve();
    cloud.chain[id] = prev.then(() => d ? cloud.ref.doc(id).set(JSON.parse(JSON.stringify(d))) : cloud.ref.doc(id).delete())
      .then(() => { cloud.dirty.delete(id); setSync("ok"); })
      .catch(e => { cloud.diag.err = e && e.code; setSync("err"); });
  }, 300);
}
function cloudFlush(){
  Object.keys(cloud.timers).forEach(id => { clearTimeout(cloud.timers[id]); delete cloud.timers[id];
    const d = db.devis.find(x => x.id === id) || tabs.find(x => x.id === id) || listes.find(x => x.id === id);
    if(cloud.ref) (d ? cloud.ref.doc(id).set(JSON.parse(JSON.stringify(d))) : cloud.ref.doc(id).delete())
      .then(() => { cloud.dirty.delete(id); setSync("ok"); }, e => { cloud.diag.err = e && e.code; setSync("err"); });
  });
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden"){ save(); cloudFlush(); } });
window.addEventListener("pagehide", () => { save(); cloudFlush(); });
function setSync(st){
  cloud.state = st;
  const el = document.getElementById("sync"); if(el) el.innerHTML = syncTxt();
  const ic = document.getElementById("syncIco"); if(ic) ic.textContent = syncIco();
}
function syncIco(){ return !cloud.ref ? (lsOk() ? "📱" : "⚠️") : cloud.state === "err" ? "⚠️" : cloud.state === "load" ? "⏳" : "☁️"; }
function syncTxt(){
  if(!cloud.ref && !lsOk()) return "⚠️ Rien n'est enregistré : ce navigateur bloque la sauvegarde";
  if(!cloud.ref) return "📱 Enregistré sur ce téléphone uniquement";
  if(cloud.state === "err") return "⚠️ Pas de réseau : enregistré sur le téléphone, envoi au retour du réseau";
  if(cloud.state === "load") return "☁️ Chargement de vos devis…";
  return "☁️ Enregistré sur votre compte";
}
async function initCloud(){
  try{
    cloud.diag.claude = !!(window.claude && window.claude.use);
    if(!cloud.diag.claude) return;
    const [store, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    cloud.diag.db = !!store; cloud.diag.user = !!user;
    if(!store || !user){ setSync(); return; }
    const uidUser = await user.id(); cloud.diag.id = !!uidUser;
    if(!uidUser){ setSync(); return; }
    cloud.ref = store.collection("data/users/" + uidUser);
    setSync("load");
    const timer = setTimeout(() => { if(cloud.state === "load") setSync("err"); }, 10000);
    let first = true;
    cloud.ref.onSnapshot(snap => {
      if(snap.metadata.fromCache && first) return;
      clearTimeout(timer);
      const serveur = new Map(snap.docs.map(x => [x.id, x.data()]));
      if(first){
        // 1re fois : on envoie les devis qui n'existent que sur ce téléphone
        db.devis.forEach(d => { if(!serveur.has(d.id)) cloudSave(d.id); });
        tabs.forEach(d => { if(!serveur.has(d.id)) cloudSave(d.id); });
        listes.forEach(d => { if(!serveur.has(d.id)) cloudSave(d.id); });
        first = false;
      }
      serveur.forEach((data, id) => {
        if(cloud.dirty.has(id) || !data || !data.id) return;
        if(data.kind === "liste"){ const c = JSON.parse(JSON.stringify(data)), j = listes.findIndex(x => x.id === id);
          if(j < 0) listes.push(c); else if((listes[j].maj||0) < (c.maj||0)) listes[j] = c; return; }
        if(data.kind === "tableau"){ const c = JSON.parse(JSON.stringify(data)), j = tabs.findIndex(x => x.id === id);
          if(j < 0) tabs.push(c); else if((tabs[j].maj||0) < (c.maj||0)) tabs[j] = c; return; }
        const i = db.devis.findIndex(x => x.id === id);
        const copie = JSON.parse(JSON.stringify(data));
        if(i < 0) db.devis.push(copie);
        else if((db.devis[i].maj||0) < (copie.maj||0)) db.devis[i] = copie;
      });
      snap.docChanges().forEach(ch => {
        if(ch.type === "removed" && !cloud.dirty.has(ch.doc.id)){ db.devis = db.devis.filter(x => x.id !== ch.doc.id); tabs = tabs.filter(x => x.id !== ch.doc.id); listes = listes.filter(x => x.id !== ch.doc.id); }
      });
      save(); try{ localStorage.setItem(KEY + "-tableaux", JSON.stringify(tabs)); localStorage.setItem(KEY + "-listes", JSON.stringify(listes)); }catch(e){}
      setSync("ok");
      const saisie = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
      if(!saisie && !document.getElementById("sheet")) render();
    }, e => { cloud.diag.err = e && e.code; setSync("err"); });
  }catch(e){ cloud.diag.err = String(e && (e.code || e.message)); setSync(); }
}

}

/* Recherche dans l'aide-mémoire de la norme */
const sansAccent = t => String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function filtreNorme(q){
  q = sansAccent(q.trim()); let total = 0;
  document.querySelectorAll(".norme details").forEach((det, i) => {
    let n = 0;
    const titreOk = sansAccent(det.querySelector("summary").textContent).includes(q);
    det.querySelectorAll("li, tr, p, h4").forEach(el => {
      if(el.querySelector("th")) return;
      const tab = el.closest("table"), h = tab && tab.previousElementSibling;
      const groupeOk = h && h.tagName === "H4" && sansAccent(h.textContent).includes(q);
      const ok = !q || titreOk || groupeOk || sansAccent(el.textContent).includes(q);
      el.hidden = !ok; if(ok) n++;
    });
    det.querySelectorAll("table").forEach(t => t.hidden = !!q && !t.querySelector("tr:not([hidden]) td"));
    det.hidden = !!q && !n; det.open = q ? n > 0 : i === 0; total += n;
  });
  const v = document.getElementById("normeVide"); if(v) v.hidden = !q || total > 0;
}
document.addEventListener("input", e => { if(e.target.id === "normeQ") filtreNorme(e.target.value); });

/* ---------- Google Drive : PDF de devis et factures (lecture seule, dossier AZEREM) ---------- */
const GDRIVE = {client:"221320566257-hhjo1g9ea21mersovch83o5g38suhp24.apps.googleusercontent.com",
  racine:"1R7W6cUriYPnS3FDHo6Ityc6ZwBU6CL07", scope:"https://www.googleapis.com/auth/drive.readonly",
  site:"lecouzduhood.github.io"};
const DOSSIER = "application/vnd.google-apps.folder";
let gTok = (() => { try{ const t = JSON.parse(sessionStorage.getItem("gdrive-tok")); return t && t.exp > Date.now() ? t : null; }catch(e){ return null; } })();
let gClient = null, gIndex = null;
function gScript(){
  if(window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  return new Promise((ok, ko) => { const sc = document.createElement("script"); sc.src = "https://accounts.google.com/gsi/client";
    sc.onload = ok; sc.onerror = () => ko(new Error("Script Google introuvable")); document.head.appendChild(sc); });
}
function gPreparer(){
  return gScript().then(() => { if(gClient) return;
    gClient = google.accounts.oauth2.initTokenClient({client_id:GDRIVE.client, scope:GDRIVE.scope, callback: r => {
      if(r && r.access_token){ gTok = {t:r.access_token, exp:Date.now() + (r.expires_in - 60) * 1000};
        try{ sessionStorage.setItem("gdrive-tok", JSON.stringify(gTok)); }catch(e){}
        if(view.name === "docs") renderDocs(); }
      else toast("Connexion Google annulée"); }});
  });
}
function gConnecter(){ if(gClient) gClient.requestAccessToken({prompt: gTok ? "" : "consent"}); else gPreparer().then(() => gClient.requestAccessToken()).catch(e => toast(e.message)); }
async function gApi(params){
  if(!gTok) throw new Error("connexion");
  const r = await fetch("https://www.googleapis.com/drive/v3/files?" + new URLSearchParams(Object.assign({pageSize:"1000",
    fields:"nextPageToken,files(id,name,mimeType,modifiedTime,webViewLink,parents)", supportsAllDrives:"true", includeItemsFromAllDrives:"true"}, params)),
    {headers:{Authorization:"Bearer " + gTok.t}});
  if(r.status === 401){ gTok = null; try{ sessionStorage.removeItem("gdrive-tok"); }catch(e){} throw new Error("connexion"); }
  if(!r.ok) throw new Error("Drive : erreur " + r.status);
  return r.json();
}
async function gTout(params){ let out = [], tok; do { const j = await gApi(Object.assign({}, params, tok ? {pageToken:tok} : {})); out = out.concat(j.files || []); tok = j.nextPageToken; } while(tok); return out; }
const dansParents = ids => "(" + ids.map(id => `'${id}' in parents`).join(" or ") + ")";
/* Tous les sous-dossiers d'AZEREM (pour chercher dedans) */
async function gDossiers(){
  if(gIndex) return gIndex;
  const idx = {[GDRIVE.racine]:{nom:"AZEREM", parent:null}}; let niveau = [GDRIVE.racine];
  while(niveau.length){ const suivant = [];
    for(let i = 0; i < niveau.length; i += 40){
      const fs = await gTout({q:`mimeType='${DOSSIER}' and trashed=false and ${dansParents(niveau.slice(i, i + 40))}`});
      fs.forEach(f => { if(!idx[f.id]){ idx[f.id] = {nom:f.name, parent:(f.parents || [])[0]}; suivant.push(f.id); } }); }
    niveau = suivant; }
  return gIndex = idx;
}
const cheminDe = (idx, id) => { const c = []; let x = idx[id]; while(x && x.parent){ c.unshift(x.nom); x = idx[x.parent]; } return c.join(" › "); };
const docDate = t => new Date(t).toLocaleDateString("fr-FR", {day:"2-digit", month:"short", year:"numeric"});
const docLigne = (f, chemin) => f.mimeType === DOSSIER

  <main class="docs">
    ${horsSite ? `<p class="cat-avert">La connexion Google ne marche que dans l'appli en ligne (lecouzduhood.github.io), pas dans l'aperçu.</p>` : ""}
    ${!gTok ? `<div class="empty"><div style="font-size:40px">🔐</div><p>Tes PDF de devis et factures sont dans ton Google Drive (dossier AZEREM).<br>Connecte-toi une fois pour les voir. Rien n'est copié ailleurs.</p>
      <button class="btn" data-act="gConnect" ${horsSite ? "disabled" : ""}>Se connecter à Google</button></div>` : `
    <input class="t" id="docQ" type="search" placeholder="🔍 Chercher un client, un n°… dans tout AZEREM" value="${esc(D.q)}" autocomplete="off" style="margin-bottom:8px">
    ${D.pile.length - 1 > (D.base || 0) ? `<div class="doc-fil">${D.pile.slice(D.base || 0).map(p => esc(p.nom)).join(" › ")}</div>` : ""}
    <div id="docListe"><div class="empty">Chargement…</div></div>`}
  </main>`;
  if(!gTok){ if(!horsSite) gPreparer().catch(() => {}); return; }

}
async function docCharger(id){
  const box = document.getElementById("docListe"), D = ui.docs;
  try{
    const fs = await gTout({q:`'${id}' in parents and trashed=false and (mimeType='${DOSSIER}' or mimeType='application/pdf')`, orderBy:"folder,modifiedTime desc"});
    // Depuis la tuile Devis / Factures : on entre directement dans le dossier correspondant s'il existe
    if(D.cible && D.pile.length === 1){ const c = fs.find(f => f.mimeType === DOSSIER && sansAccent(f.name).includes(D.cible));
      D.cible = D.cible + "-fait"; if(c){ D.pile.push({id:c.id, nom:c.name}); D.base = 1; return renderDocs(); } }
    if(view.name !== "docs" || D.q) return;
    box.innerHTML = fs.length ? fs.map(f => docLigne(f)).join("") : `<div class="empty">Aucun PDF ici.</div>`;
  }catch(e){ if(e.message === "connexion") return renderDocs(); box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
let docMinuteur = null;
async function docChercher(q){
  const box = document.getElementById("docListe"); if(!box) return;
  box.innerHTML = `<div class="empty">Recherche…</div>`;
  try{
    const idx = await gDossiers(), ids = Object.keys(idx), mot = q.replace(/\\/g, "").replace(/'/g, "\\'");
    let res = [];
    for(let i = 0; i < ids.length; i += 40)
      res = res.concat(await gTout({q:`mimeType='application/pdf' and trashed=false and name contains '${mot}' and ${dansParents(ids.slice(i, i + 40))}`}));
    if(ui.docs.q !== q) return;
    res.sort((a, b) => b.modifiedTime.localeCompare(a.modifiedTime));
    box.innerHTML = res.length ? res.slice(0, 200).map(f => docLigne(f, cheminDe(idx, (f.parents || [])[0]))).join("") : `<div class="empty">Aucun PDF trouvé pour « ${esc(q)} ».</div>`;
  }catch(e){ if(e.message === "connexion") return renderDocs(); box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
document.addEventListener("input", e => { if(e.target.id !== "docQ") return;
  ui.docs.q = e.target.value.trim(); clearTimeout(docMinuteur);

const logement = d => d.logement || (d.logement = {hsp:"", etages:"", note:"", prest:[]});
/* Surface totale du logement = somme des pièces (l'extérieur est indiqué à part) */
const EXT = /ext[ée]rieur|terrasse|balcon|jardin|cour\b/i;
function surfTotale(d){ let t = 0, e = 0; d.pieces.forEach(p => { if(p.surface > 0){ t += p.surface; if(EXT.test(p.nom || "")) e += p.surface; } });
  t = Math.round(t * 100) / 100; e = Math.round(e * 100) / 100;
  return t ? m2(t) + (e ? ` (dont ${m2(e)} extérieur)` : "") : ""; }
function majLogM2(d){ const e = document.getElementById("logM2"); if(e) e.textContent = surfTotale(d) || "—"; }
function logementHTML(d){
  const L = logement(d), ouvert = !!ui.logOuvert;
  const resume = [surfTotale(d).replace(/ \(.*/, ""), L.hsp && "HSP " + L.hsp + " m", L.etages && L.etages + " étage" + (L.etages > 1 ? "s" : ""), L.prest.length && L.prest.length + " prest. partout"].filter(Boolean).join(" · ");
  return `<details class="logement" ${ouvert ? "open" : ""}><summary><span>🏠 Tout le logement</span><small>${esc(resume)}</small></summary>
    <div class="log-body">
      <div class="log-m2">Surface totale : <b id="logM2">${esc(surfTotale(d) || "—")}</b> <small>(somme des pièces)</small></div>
      <div class="row2"><label class="f" style="flex:1"><span>Hauteur sous plafond</span><span class="cr-in"><input class="t" data-g="hsp" inputmode="decimal" value="${esc(L.hsp)}" placeholder="2,50" autocomplete="off">m</span></label>
        <label class="f" style="flex:1"><span>Nombre d'étages</span><input class="t" data-g="etages" inputmode="numeric" value="${esc(L.etages)}" placeholder="—" autocomplete="off"></label></div>
      <div class="f"><span>Prestations pour tout le logement <small>(ajoutées dans chaque pièce)</small></span>
        <div class="log-chips">${Object.entries(BASIQUES_RENO).map(([k, lib]) => { const on = L.prest.includes(k), o = (L.opts || {})[k] || [];
          return `<button class="chip ${on ? "on" : ""}" data-act="globPrest" data-k="${k}">${on ? "✓ " : ""}${esc(lib)}${on && o.length ? ` <small>· ${esc(o.join(", "))}</small>` : ""}</button>`; }).join("")}</div></div>
      <label class="f" style="margin-top:10px"><span>Commentaire sur l'ensemble</span><textarea class="t" data-g="note" placeholder="Ex. tout le sol démoli, plafonds à refaire, accès difficile…">${esc(L.note)}</textarea></label>
    </div></details>`;
}
/* Prestations « tout le logement » : une ligne par pièce, avec les mêmes choix (Murs, Plafond…).
   Changer les choix ici met à jour la prestation dans toutes les pièces. */
function globAjoute(d, p){ const L = d.logement; if(!L || !typeOf(d.type).general) return;
  L.prest.forEach(k => { const o = (L.opts || {})[k] || [];
    let l = p.lignes.find(x => x.glob && x.presta === k) || p.lignes.find(x => x.presta === k);   // déjà ajoutée à la main : on la reprend
    if(!l){ l = newLigne(k, p); l.noteOn = false; p.lignes.push(l); }
    l.glob = true; l.opts = [...o]; }); }
function globRetire(d, k){ const L = logement(d); L.prest = L.prest.filter(x => x !== k); if(L.opts) delete L.opts[k];
  d.pieces.forEach(p => p.lignes = p.lignes.filter(l => { if(!(l.glob && l.presta === k)) return true; if(l.note){ delete l.glob; return true; } return false; })); }
function globSheet(d, k){
  const L = logement(d), on = L.prest.includes(k), sel = new Set(on ? (L.opts || {})[k] || [] : []);
  const box = ops => ops.map(o => `<button class="pick ${sel.has(o)?"sel":""}" data-o="${esc(o)}"><span class="ck">${sel.has(o)?"✓":""}</span>${esc(o)}</button>`).join("");
  const s = sheet(`<h3 style="--h:${teinte(k)}"><span class="opt-pastille"></span>${esc(BASIQUES_RENO[k])} <small style="font-weight:400;color:var(--muted)">· tout le logement</small></h3>
    <p class="hint" style="margin:-4px 0 8px;font-size:13px;color:var(--muted)">Ajoutée dans chaque pièce avec ces choix. Si tu les changes ici, toutes les pièces suivent.</p>
    ${OPTS_RENO[k] ? `<div class="pick-h">Quoi ?</div>${box(OPTS_RENO[k])}` : ""}
    ${OPTS_POSE[k] ? `<div class="pick-h">Pose</div>${box(OPTS_POSE[k])}` : ""}
    ${on ? `<button class="btn sec danger-t" data-s="del" style="width:100%;margin-top:10px">Retirer de tout le logement</button>` : ""}
    <div class="sheet-foot row2"><button class="btn sec" data-s="no">Annuler</button><button class="btn" data-s="ok">${on ? "Mettre à jour partout" : "Ajouter partout"}</button></div>`);
  s.querySelectorAll(".pick").forEach(b => b.onclick = () => { const o = b.dataset.o; sel.has(o) ? sel.delete(o) : sel.add(o);
    b.classList.toggle("sel", sel.has(o)); b.querySelector(".ck").textContent = sel.has(o) ? "✓" : ""; });
  const fin = () => { ui.logOuvert = true; touch(); closeSheet(); const y = window.scrollY; renderDevis(); window.scrollTo(0, y); };
  s.querySelector('[data-s="no"]').onclick = closeSheet;
  const del = s.querySelector('[data-s="del"]'); if(del) del.onclick = () => { globRetire(d, k); fin(); };
  s.querySelector('[data-s="ok"]').onclick = () => { L.opts = L.opts || {}; L.opts[k] = optsDe(k).filter(o => sel.has(o));
    if(!on) L.prest.push(k); d.pieces.forEach(p => globAjoute(d, p)); fin(); };
}

/* Texte des infos générales (récap + PDF) */
function noteGenerale(d){
  const L = d.logement, out = [];
  if(L && typeOf(d.type).general){
    const a = [surfTotale(d) && "Surface totale : " + surfTotale(d), L.hsp && "Hauteur sous plafond : " + L.hsp + " m", L.etages && "Étages : " + L.etages].filter(Boolean).join(" · "); if(a) out.push(a);
    if(L.prest.length) out.push("Pour tout le logement : " + L.prest.map(k => { const o = (L.opts || {})[k] || []; return BASIQUES_RENO[k] + (o.length ? " (" + o.join(", ") + ")" : ""); }).join(", "));
    if(L.note && L.note.trim()) out.push(L.note.trim());
  }
  if(d.note && d.note.trim()) out.push(d.note.trim());
  return out.join("\n");
}

function filtrer(){

  return [...db.devis].filter(d => !q || [d.client,d.adresse,d.tel].join(" ").toLowerCase().includes(q)).sort((a,b)=>b.maj-a.maj);

function ilya(t){
  const m = Math.round((Date.now()-t)/60000);
  if(m < 1) return "à l'instant";
  if(m < 60) return `il y a ${m} min`;
  const h = Math.round(m/60); if(h < 24) return `il y a ${h} h`;
  const j = Math.round(h/24); if(j === 1) return "hier"; if(j < 7) return `il y a ${j} jours`;

function renderHome(){
  const n = db.devis.length;
  $app.innerHTML = `
  <header class="hero">
    <img class="hero-logo" src="${LOGO}" alt="Azerem">
    <div class="hero-txt"><div class="hero-sub">Notes de devis</div>
    <div class="hero-date">${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</div>
    <div class="hero-cats"><button class="hero-cat" data-act="catalogue">⚡ Prix élec</button><button class="hero-cat" data-act="catalogueTce">🧱 Prix TCE</button></div></div>
    <button class="retour hero-ret" data-act="accueil" aria-label="Accueil">‹</button>
  </header>
  <main>
    ${n ? `<div class="home-h"><h2 class="titre-notes">Mes notes en cours <span class="cnt">${n}</span></h2></div>
    ${n > 3 ? `<input class="t" id="recherche" type="search" placeholder="🔍 Rechercher un client, une adresse…" value="${esc(ui.recherche||"")}" style="margin-bottom:10px">` : ""}` : ""}
    <div id="liste">${listeHTML(filtrer())}</div>
    <button class="sync" id="sync" data-act="diag">${syncTxt()}</button>
  </main>
  <div class="bottom"><button class="btn" data-act="new">＋ Nouvelle note de devis</button></div>`;
}

function listeHTML(list){
  if(!db.devis.length) return `<div class="vide">
      <div class="vide-ico">📝</div>
      <b>Aucune note pour l'instant</b>
      <p>Chez le client, créez une note : choisissez le type de travaux, les pièces, puis cochez les prestations et les quantités.</p>
    </div>`;
  if(!list.length) return `<div class="empty">Aucune note ne correspond à « ${esc(ui.recherche)} ».</div>`;
  return list.map(d=>{
    const t = typeOf(d.type), n = d.pieces.reduce((s,p)=>s+nbLignes(p),0), sf = surfTot(d);
    const stats = [`${n} prestation${n>1?"s":""}`];
    if(!(t.sansPieces && d.pieces.length<=1)) stats.unshift(`${d.pieces.length} pièce${d.pieces.length>1?"s":""}`);
    if(sf) stats.push(m2(sf));
    return `<div class="note" data-type="${t.id}">
      <button class="note-open" data-act="open" data-id="${d.id}">
        <span class="note-top"><span class="chip-type">${t.ico} ${esc(t.nom)}</span><span class="quand">${ilya(d.maj)}</span></span>
        <b class="note-client">${esc(d.client || "Client sans nom")}</b>
        ${d.adresse ? `<span class="note-adr">📍 ${esc(d.adresse)}</span>` : ""}
        <span class="note-stats">${stats.join(" · ")}</span>
      </button>
      <button class="note-menu" data-act="menuDevis" data-id="${d.id}" aria-label="Gérer cette note">⋯</button>
    </div>`;}).join("");
}

function menuDevis(d){
  if(!d) return;
  const s = sheet(`<h3>${esc(d.client || "Client sans nom")}</h3>
    <div class="menu">
      <button data-m="open">📂 Ouvrir la note</button>
      <button data-m="recap">📋 Voir le récapitulatif</button>
      <button data-m="infos">✎ Modifier nom, adresse, téléphone</button>
      <button data-m="dup">⧉ Dupliquer (même relevé pour un autre client)</button>
      <button data-m="del" class="rouge">🗑 Supprimer la note</button>
    </div>
    <button class="btn sec" data-s="no">Fermer</button>`);
  s.querySelector('[data-s="no"]').onclick = closeSheet;
  s.querySelectorAll("[data-m]").forEach(b => b.onclick = () => {
    const m = b.dataset.m; closeSheet();
    if(m === "open"){ ui.pieceId = null; go("devis",{id:d.id}); }
    if(m === "recap") go("recap",{id:d.id});
    if(m === "infos"){ view = {name:"home", id:d.id}; infosSheet(); }
    if(m === "dup"){ const c = JSON.parse(JSON.stringify(d)); c.id = uid(); c.client = (d.client||"Client") + " (copie)";
      c.cree = c.maj = Date.now(); c.pieces.forEach(p => { p.id = uid(); p.lignes.forEach(l => l.id = uid()); });
      db.devis.push(c); cloudSave(c.id); save(); renderHome(); toast("Note dupliquée"); }
    if(m === "del") supprimerDevis(d);
  });
}
function supprimerDevis(d){
  confirmSheet(`Supprimer définitivement la note « ${esc(d.client || "Client sans nom")} » ?`, "Supprimer", () => {
    db.devis = db.devis.filter(x=>x.id!==d.id); save(); cloudSave(d.id); go("home"); toast("Note supprimée"); });
}

function renderNew(){

/* ---------- Plan des pièces (à l'échelle de la surface) ---------- */
const LEGENDE_PLAN = "Schéma de principe, donné à titre indicatif : la disposition et les proportions des pièces ne sont pas à l'échelle. Seules les mesures relevées sur place font foi.";
const PLAN_M = 30;                     // taille du plan : 30 m × 30 m
const SURF_DEF = 9;                    // surface supposée si non renseignée
function dimsPiece(p, pl){
  const S = p.surface || SURF_DEF, r = (pl && pl.r) || 1;
  const w = Math.sqrt(S * r); return {w, h: S / w, S};
}
const arr = v => Math.round(v * 4) / 4;          // arrondi au quart de mètre
const mTxt = v => (Math.round(v * 10) / 10).toString().replace(".", ",");
/* Collisions : les pièces peuvent se toucher mais pas se superposer */
const EPS = 0.01;
function autresRect(d, id){
  return Object.entries(d.plan).filter(([k]) => k !== id).map(([k, q]) => { const pp = d.pieces.find(t => t.id === k);
    return pp ? {x: q.x, y: q.y, ...dimsPiece(pp, q)} : null; }).filter(Boolean);
}
const chevauche = (x, y, w, h, o) => x < o.x + o.w - EPS && x + w > o.x + EPS && y < o.y + o.h - EPS && y + h > o.y + EPS;
function libre(d, id, x, y, w, h){ return !autresRect(d, id).some(o => chevauche(x, y, w, h, o)); }
// Déplacement de (px,py) vers (x,y) : la pièce glisse et s'arrête contre les murs des autres
function bloque(d, id, px, py, x, y, w, h){
  const os = autresRect(d, id);
  let nx = x;
  for(let k = 0; k < 6; k++){ const o = os.find(o => chevauche(nx, py, w, h, o)); if(!o) break;
    nx = nx > px ? o.x - w : o.x + o.w; }
  if(nx < 0 || os.some(o => chevauche(nx, py, w, h, o))) nx = px;
  let ny = y;
  for(let k = 0; k < 6; k++){ const o = os.find(o => chevauche(nx, ny, w, h, o)); if(!o) break;
    ny = ny > py ? o.y - h : o.y + o.h; }
  if(ny < 0 || os.some(o => chevauche(nx, ny, w, h, o))) ny = py;
  return [nx, ny];
}
function renderPlan(){

  const aPlacer = d.pieces.filter(p => !d.plan[p.id]);
  if(ui.planSel && !d.plan[ui.planSel]) ui.planSel = null;

  const scroll = wrapOld ? [wrapOld.scrollLeft, wrapOld.scrollTop] : (ui.planScroll || [0, 0]);
  const roomHTML = p => { const pl = d.plan[p.id], {w, h, S} = dimsPiece(p, pl);
    return `<div class="proom ${p.surface?"":"nosurf"} ${p.id===ui.planSel?"sel":""}" data-pid="${p.id}"
      style="left:${pl.x*z}px;top:${pl.y*z}px;width:${w*z}px;height:${h*z}px">
      <b>${esc(p.nom)}</b><small>${p.surface ? m2(S) : "? m²"}</small></div>`; };
  let panel = "";
  if(sel){ const pl = d.plan[sel.id], {w, h} = dimsPiece(sel, pl);
    panel = `<div class="plan-panel">
      <h3>${esc(sel.nom)}</h3>

  $app.innerHTML = `

    if(a === "place"){
      const p = d.pieces.find(x => x.id === b.dataset.pid), {w} = dimsPiece(p, {r:1});
      // à droite de la dernière pièce posée ; au bord de l'écran, on passe à la ligne
      const poses = Object.entries(d.plan).map(([id, q]) => { const pp = d.pieces.find(t => t.id === id); return pp ? {q, ...dimsPiece(pp, q)} : null; }).filter(Boolean);
      const gauche = arr(wrap.scrollLeft / z + 1), droite = Math.min(PLAN_M, (wrap.scrollLeft + wrap.clientWidth) / z);
      let x = gauche, y = arr(wrap.scrollTop / z + 1);
      if(poses.length){ const der = poses[poses.length - 1];
        x = arr(der.q.x + der.w + 0.5); y = der.q.y;
        if(x + w > droite){ x = gauche; y = arr(Math.max(...poses.map(o => o.q.y + o.h)) + 0.5); } }
      x = Math.max(0, x); y = Math.max(0, Math.min(y, PLAN_M - 1));
      if(!libre(d, p.id, x, y, w, w)){   // cherche une place libre, ligne par ligne
        let ok = false;
        for(let yy = 0; yy < PLAN_M && !ok; yy += 0.5) for(let xx = 0; xx + w <= PLAN_M && !ok; xx += 0.5)
          if(libre(d, p.id, xx, yy, w, w)){ x = xx; y = yy; ok = true; }
      }
      d.plan[p.id] = {x, y, r: 1};
      ui.planSel = p.id; touch(); renderPlan(); return;
    }
    if(!pl) return;
    if(a === "retire"){ delete d.plan[sel.id]; ui.planSel = null; touch(); renderPlan(); return; }
    const r0 = pl.r || 1;
    pl.r = a === "large" ? r0 * 1.25 : a === "haut" ? r0 / 1.25 : 1 / r0;
    if(!placeOk(d, sel, pl)){ pl.r = r0; return; }
    touch(); renderPlan();
  });
  const surf = document.getElementById("planSurf"), lon = document.getElementById("planLong");
  if(surf) surf.onchange = () => { const v = parseFloat(surf.value.replace(",", ".")), s0 = sel.surface;
    sel.surface = v > 0 ? v : null; if(!placeOk(d, sel, d.plan[sel.id])) sel.surface = s0; touch(); renderPlan(); };
  if(lon) lon.onchange = () => { const v = parseFloat(lon.value.replace(",", ".")), S = sel.surface || SURF_DEF, pl = d.plan[sel.id], r0 = pl.r;
    if(v > 0){ pl.r = v * v / S; if(placeOk(d, sel, pl)) touch(); else pl.r = r0; } renderPlan(); };

  // Déplacement au doigt
  let drag = null;
  wrap.querySelectorAll(".proom").forEach(el => {
    el.addEventListener("pointerdown", e => {
      const pl = d.plan[el.dataset.pid];
      drag = {el, pl, x0: e.clientX, y0: e.clientY, px: pl.x, py: pl.y, moved: false};
      el.setPointerCapture(e.pointerId);
      wrap.querySelectorAll(".proom.sel").forEach(o => o.classList.remove("sel")); el.classList.add("sel");
    });
    el.addEventListener("pointermove", e => {
      if(!drag || drag.el !== el) return;
      const dx = (e.clientX - drag.x0) / z, dy = (e.clientY - drag.y0) / z;
      if(Math.abs(dx) + Math.abs(dy) > 0.1) drag.moved = true;
      const pp = d.pieces.find(t => t.id === el.dataset.pid), {w, h} = dimsPiece(pp, drag.pl);
      const [nx, ny] = bloque(d, pp.id, drag.pl.x, drag.pl.y, Math.max(0, arr(drag.px + dx)), Math.max(0, arr(drag.py + dy)), w, h);
      drag.pl.x = nx; drag.pl.y = ny;
      el.style.left = drag.pl.x * z + "px"; el.style.top = drag.pl.y * z + "px";
    });
    const fin = () => { if(!drag || drag.el !== el) return;
      const id = el.dataset.pid; drag = null; ui.planSel = id; touch(); renderPlan(); };
    el.addEventListener("pointerup", fin); el.addEventListener("pointercancel", fin);
  });
  document.getElementById("planGrid").addEventListener("click", e => {
    if(e.target.id === "planGrid" && ui.planSel){ ui.planSel = null; renderPlan(); } });
}
/* Plan en image (SVG) pour le récapitulatif */
function planSVG(d){
  const pl = d.plan || {};
  const ps = d.pieces.filter(p => pl[p.id]).map(p => ({p, q: pl[p.id], ...dimsPiece(p, pl[p.id])}));
  if(!ps.length) return "";
  const m = 0.5, x0 = Math.min(...ps.map(o => o.q.x)) - m, y0 = Math.min(...ps.map(o => o.q.y)) - m;
  const x1 = Math.max(...ps.map(o => o.q.x + o.w)) + m, y1 = Math.max(...ps.map(o => o.q.y + o.h)) + m;
  const W = x1 - x0, H = y1 - y0, fs = Math.max(0.35, Math.min(0.6, W / 18));
  let grille = "";
  for(let x = Math.ceil(x0); x <= x1; x++) grille += `<line x1="${x}" y1="${y0}" x2="${x}" y2="${y1}"/>`;
  for(let y = Math.ceil(y0); y <= y1; y++) grille += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}"/>`;
  return `<svg class="plan-svg" viewBox="${x0} ${y0} ${W} ${H}" role="img" aria-label="Plan des pièces">
    <g class="g" stroke-width="0.02">${grille}</g>
    ${ps.map(o => { const t = Math.min(fs, o.w * 0.9 / (Math.max(o.p.nom.length, 6) * 0.58));
      return `<g><rect x="${o.q.x}" y="${o.q.y}" width="${o.w}" height="${o.h}" class="r ${o.p.surface?"":"ns"}" stroke-width="0.07"/>
      <text x="${o.q.x + o.w/2}" y="${o.q.y + o.h/2}" font-size="${t}" text-anchor="middle" font-weight="700">${esc(o.p.nom)}</text>
      <text x="${o.q.x + o.w/2}" y="${o.q.y + o.h/2 + t*1.2}" font-size="${t*0.85}" text-anchor="middle" class="s">${o.p.surface ? m2(o.S) : "? m²"}</text></g>`; }).join("")}
  </svg>`;
}
function placeOk(d, p, pl){ const {w, h} = dimsPiece(p, pl);
  if(libre(d, p.id, pl.x, pl.y, w, h)) return true;
  toast("Pas la place : une autre pièce bloque"); return false; }
function zoomPlan(f){
  const wrap = document.getElementById("planWrap"), z = ui.zoom || 28, nz = Math.min(70, Math.max(10, z * f));
  // garde le centre de la vue
  const cx = (wrap.scrollLeft + wrap.clientWidth / 2) / z, cy = (wrap.scrollTop + wrap.clientHeight / 2) / z;
  ui.zoom = nz; renderPlan();
  const w2 = document.getElementById("planWrap");
  w2.scrollLeft = cx * nz - w2.clientWidth / 2; w2.scrollTop = cy * nz - w2.clientHeight / 2;
}

function surfTot(d){ return Math.round(d.pieces.reduce((s,p)=>s+(p.surface||0),0)*100)/100; }
function recapTexte(d){
  const t = typeOf(d.type);
  const L = [`DEVIS — ${t.nom}`, `Client : ${d.client||"-"}`];
  if(d.adresse) L.push(`Adresse : ${d.adresse}`);
  if(d.tel) L.push(`Tél : ${d.tel}`);
  L.push(`Relevé du ${fmtDate(d.cree)}`);
  if(surfTot(d)) L.push(`Surface relevée : ${m2(surfTot(d))}`);
  L.push("");
  d.pieces.forEach(p=>{
    const ls = p.lignes.filter(l=>l.qte>0);
    if(!ls.length && !p.note && !p.surface) return;
    if(!(t.sansPieces && d.pieces.length<=1)) L.push(`== ${p.nom.toUpperCase()}${p.surface?` — ${m2(p.surface)}`:""}${p.etage?` (étage : ${p.etage})`:""} ==`);
    ls.forEach(l=>{ const u = unite(l);
      L.push(`- ${libL(l)}${estElec(l,d)?` (${(POSE_NOM[l.pose]||"Encastré").toLowerCase()})`:""} : ${u==="u"?"x "+String(l.qte).replace(".",","):String(l.qte).replace(".",",")+" "+u}`);
      if(l.note && noteActive(l)) L.push(`    Note : ${l.note}`); });
    if(p.note && noteP(p)) L.push(`Note : ${p.note}`);
    L.push("");
  });
  return L.join("\n");
}

/* ---------- Récapitulatif en PDF ---------- */
// Bibliothèque PDF livrée avec l'appli (marche hors ligne), sinon depuis cdnjs
const JSPDF_URLS = ["jspdf.umd.min.js", "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"];
let jspdfP = null;
function chargerJsPDF(){
  if(window.jspdf) return Promise.resolve(window.jspdf);
  const essai = i => new Promise((ok, ko) => {
    if(i >= JSPDF_URLS.length) return ko(new Error("Réseau"));
    const s = document.createElement("script"); s.src = JSPDF_URLS[i];
    s.onload = () => window.jspdf ? ok(window.jspdf) : essai(i + 1).then(ok, ko);
    s.onerror = () => { s.remove(); essai(i + 1).then(ok, ko); };
    document.head.appendChild(s);
  });
  if(!jspdfP) jspdfP = essai(0).catch(e => { jspdfP = null; throw e; });
  return jspdfP;
}
function logoPNG(){
  return new Promise(ok => { const im = new Image();
    im.onload = () => { try{ const c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight;
      c.getContext("2d").drawImage(im, 0, 0); ok({url: c.toDataURL("image/png"), w: c.width, h: c.height, img: im}); }catch(e){ ok(null); } };
    im.onerror = () => ok(null); im.src = LOGO; });
}
// Retire les caractères que la police du PDF ne sait pas écrire (émojis…)
const pdfTxt = s => String(s == null ? "" : s).replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
  .replace(/[^\x20-\x7E -ÿŒœ–—…€]/g, "").replace(/\s+/g, " ").trim();
const qtePdf = (l, u) => { u = u || unite(l); const q = String(l.qte).replace(".", ","); return u === "u" ? "× " + q : q + " " + u; };
function nomPDF(d){
  const t = typeOf(d.type), dt = new Date(d.cree || Date.now());
  const j = String(dt.getDate()).padStart(2,"0") + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + dt.getFullYear();
  return (`Devis ${d.client || "client"} ${t.nom} ${j}`).normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^A-Za-z0-9 _-]/g, "").replace(/\s+/g, " ").trim().slice(0, 80) + ".pdf";
}
async function recapPDF(d, Doc){

  police(9.5, "normal", [205,205,215]); doc.text(pdfTxt(t.nom + " · relevé du " + fmtDate(d.cree)), M, 20);
  if(logo){ const lh = 13, lw = lh * logo.w / logo.h; doc.addImage(logo.url, "PNG", PW - M - lw, 7.5, lw, lh); }
  y = 36;

  const droite = [["Type", t.nom], ["Date", fmtDate(d.cree)]];

  if(surfTot(d)) droite.push(["Surface", m2(surfTot(d))]);

  const hB = Math.max(hG, hD) + 3;

  police(7.5, "bold", ROSE); doc.text("CLIENT", M + 4, y + 6); doc.text("RELEVÉ", cx2 + 4, y + 6);
  let yy = y + 12;
  gl.forEach(([k, ls]) => { if(k === "b"){ police(13, "bold"); ls.forEach(l => { doc.text(l, M + 4, yy); yy += 6; }); }
    else { police(10, "normal", GRIS); ls.forEach(l => { doc.text(l, M + 4, yy); yy += 4.8; }); } });
  yy = y + 12;
  droite.forEach(([k, v]) => { police(9, "normal", CLAIR); doc.text(k, cx2 + 4, yy); police(10, "bold"); doc.text(pdfTxt(v), cx2 + colW - 4, yy, {align: "right"}); yy += 5; });

  if(ng){

async function pdfAction(d, mode){

  if(!pdfPret(d)) toast("Création du PDF…");

    const blob = await pdfBlob(d), nom = nomPDF(d);
    const dansCadre = window.top !== window.self;
    if(mode === "share" && !dansCadre && navigator.share && window.File){
      const f = new File([blob], nom, {type: "application/pdf"});
      if(!navigator.canShare || navigator.canShare({files: [f]})){
        try{ await navigator.share({files: [f], title: nom.replace(/\.pdf$/, "")}); }
        catch(e){ if(!e || e.name !== "AbortError") telechargerBlob(blob, nom); }
        return;
      }
    }
    if(dansCadre && window.claude && claude.use){
      const dl = await claude.use("downloads");
      if(dl){ try{ await dl.save({filename: nom, data: blob}); }catch(e){ if(!e || e.code !== "declined") toast("Téléchargement impossible ici"); } return; }
    }
    telechargerBlob(blob, nom);
  }catch(e){ toast(e && e.message === "Réseau" ? "Connexion nécessaire pour créer le PDF" : "Erreur pendant la création du PDF"); }
  finally{ ui.pdfEnCours = false; }
}

/* Faux document qui reproduit les appels jsPDF sur un canvas : sert à l'aperçu à l'écran */
class CanvasDoc{

  _font(mul){ const s = this.st; return `${s === "italic" ? "italic " : ""}${s === "bold" ? "700 " : ""}${this.fs * .3528 * (mul || 1)}px Helvetica, Arial, sans-serif`; }
  _op(f){ this.pages[this.cur].push(f); }
  setFont(_, st){ this.st = st || "normal"; } setFontSize(s){ this.fs = s; }
  setTextColor(...a){ this.tc = this._c(a); } setFillColor(...a){ this.fc = this._c(a); } setDrawColor(...a){ this.dc = this._c(a); } setLineWidth(w){ this.lw = w; }

  splitTextToSize(s, max){ const out = []; String(s).split("\n").forEach(par => { let cur = "";
      par.split(" ").forEach(w => { const t = cur ? cur + " " + w : w; if(cur && this.getTextWidth(t) > max){ out.push(cur); cur = w; } else cur = t; });
      out.push(cur); }); return out; }
  text(t, x, y, o){ const lines = Array.isArray(t) ? t : [t], font = this._font(), col = this.tc, lh = this.fs * .3528 * 1.15, al = (o && o.align) || "left";

  roundedRect(x, y, w, h, r, _, s){ const fc = this.fc, dc = this.dc, lw = this.lw;
    this._op(c => { c.beginPath(); if(c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h);
      if(s === "F" || s === "FD"){ c.fillStyle = fc; c.fill(); } if(s !== "F"){ c.strokeStyle = dc; c.lineWidth = lw; c.stroke(); } }); }
  rect(x, y, w, h, s){ const fc = this.fc, dc = this.dc, lw = this.lw;
    this._op(c => { if(s === "F" || s === "FD"){ c.fillStyle = fc; c.fillRect(x, y, w, h); } if(s !== "F"){ c.strokeStyle = dc; c.lineWidth = lw; c.strokeRect(x, y, w, h); } }); }
  line(x1, y1, x2, y2){ const dc = this.dc, lw = this.lw; this._op(c => { c.strokeStyle = dc; c.lineWidth = lw; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }); }
  addImage(url, _, x, y, w, h){ const im = new Image(); im.src = url; this._op(c => { try{ c.drawImage(im, x, y, w, h); }catch(e){} }); (this.imgs = this.imgs || []).push(im); }
  addPage(){ this.pages.push([]); this.cur = this.pages.length - 1; }
  getNumberOfPages(){ return this.pages.length; } setPage(i){ this.cur = i - 1; }
  async rendre(k){
    await Promise.all((this.imgs || []).map(im => im.decode ? im.decode().catch(() => {}) : null));

  }

    if(sel.size){ sel.forEach(k => p.lignes.push(newLigne(k, p))); touch(); renderDevis(); }   // ne pas perdre ce qui était déjà coché

  s.querySelector('[data-s="no"]').onclick = closeSheet;

/* Paramètres d'une pièce : nom, surface, étage, suppression */
function roomSheet(p){
  const d = cur(), t = typeOf(d.type); if(!p) return;
  const s = sheet(`<h3>Paramètres de la pièce</h3>
    <label class="f"><span>Nom de la pièce</span><input class="t" id="rNom" value="${esc(p.nom)}"></label>
    ${t.sansPieces || t.general ? "" : `<div class="f"><span>Dimensions → surface</span>
      <div class="dims"><input class="t" id="rLong" inputmode="decimal" placeholder="Longueur" value="${p.long ? String(p.long).replace(".",",") : ""}" autocomplete="off"><b>×</b>
      <input class="t" id="rLarg" inputmode="decimal" placeholder="Largeur" value="${p.larg ? String(p.larg).replace(".",",") : ""}" autocomplete="off"><b>m</b></div>
      <small class="dims-r" id="rM2">${p.surface ? "= " + m2(p.surface) : "Tape la longueur et la largeur en mètres"}</small></div>`}
    ${t.general ? `<label class="f"><span>Forcer la surface <small>(remplace L × l)</small></span><span class="cr-in"><input class="t" id="rForce" inputmode="decimal" autocomplete="off" placeholder="${p.long && p.larg ? nb(Math.round(p.long * p.larg * 100) / 100) : "—"}" value="${p.surfForce ? nb(p.surfForce) : ""}">m²</span>
      <small style="color:var(--muted)">Laisse vide pour reprendre le calcul L × l.</small></label>` : ""}
    ${t.etage ? `<label class="f"><span>Étage</span><input class="t" id="rEtage" value="${esc(p.etage||"")}" placeholder="—" autocomplete="off"></label>` : ""}
    <div class="row2"><button class="btn sec danger-t" data-s="del">🗑 Supprimer</button><button class="btn" data-s="ok">Enregistrer</button></div>`);
  const num = id => { const e = s.querySelector(id); const v = e ? parseFloat(e.value.replace(",", ".")) : NaN; return v > 0 ? v : null; };
  const calc = () => { const L = num("#rLong"), l = num("#rLarg"); return L && l ? Math.round(L * l * 100) / 100 : null; };
  s.querySelectorAll("#rLong, #rLarg").forEach(e => e.addEventListener("input", () => { const v = calc();
    s.querySelector("#rM2").textContent = v ? "= " + m2(v) : (p.surface ? "= " + m2(p.surface) : "Tape la longueur et la largeur en mètres"); }));
  s.querySelector('[data-s="ok"]').onclick = () => {
    p.nom = s.querySelector("#rNom").value.trim() || p.nom;
    if(s.querySelector("#rLong")){ p.long = num("#rLong"); p.larg = num("#rLarg"); const v = calc(); if(v) p.surface = v; }
    const et = s.querySelector("#rEtage"); if(et) p.etage = et.value.trim();
    const fo = s.querySelector("#rForce"); if(fo){ const v = parseFloat(fo.value.replace(",", ".")); p.surfForce = v > 0 ? Math.round(v * 100) / 100 : null;
      p.surface = p.surfForce || (p.long && p.larg ? Math.round(p.long * p.larg * 100) / 100 : null); }
    touch(); closeSheet(); renderDevis();
  };
  s.querySelector('[data-s="del"]').onclick = () => { ui.pieceId = p.id; closeSheet();
    actDelPiece(d, p); };
}

function copier(txt){
  const ok = () => toast("Récapitulatif copié");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, () => fallback());
  } else fallback();
  function fallback(){
    const ta = document.createElement("textarea"); ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); ok(); }catch(e){ toast("Copie impossible"); }
    ta.remove();
  }
}

/* Clavier iPhone : touche « OK » qui ferme le clavier sur les champs d'une ligne, et bouton « Fermer le clavier » au-dessus du clavier */
const kb = document.createElement("button"); kb.id = "kbClose"; kb.type = "button"; kb.textContent = "⌄ Fermer le clavier";
